apply plugin: 'java'
apply plugin: 'java-library'

buildDir = file("/tmp/build-i2p/gradle")

String getReleaseVersion() {
    def releaseVersion
    file("core/java/src/net/i2p/CoreVersion.java").readLines().findAll({ line ->
        line.contains("static final String VERSION")
    }).first().eachMatch('.*"([^"]+)";', {
        releaseVersion = it[1]
    })
    releaseVersion
}

String getBuildVersion() {
    def buildVersion
    file("router/java/src/net/i2p/router/RouterVersion.java").readLines().findAll({ line ->
        line.contains("static final long BUILD")
    }).first().eachMatch('.*=\\s+([0-9]+);', {
        buildVersion = it[1]
    })
    buildVersion
}

String getBuildExtra() {
    def buildExtra
    file("router/java/src/net/i2p/router/RouterVersion.java").readLines().findAll({ line ->
        line.contains("static final String EXTRA")
    }).first().eachMatch('.*"(.*)";', {
        buildExtra = it[1]
    })
    buildExtra
}

String getBuiltBy() {
    def builtBy = ""
    def overrideProps = file("override.properties")
    if (overrideProps.exists()) {
        overrideProps.readLines().findAll({ line ->
            line.contains("build.built-by")
        }).first().eachMatch('.*=(.*)', {
            builtBy = it[1]
        })
    }
    builtBy
}

String compat(String src) {
    if (src.contains('.')) {
        src.substring(src.lastIndexOf('.') + 1)
    } else {
        src
    }
}

// Lazily resolved provider: the short git revision (ant workspace.version,
// git rev-parse --short=8 HEAD), "unknown" when not a git checkout
ext.workspaceVersion = providers.exec {
    commandLine 'git', 'rev-parse', '--short=8', 'HEAD'
    workingDir = rootDir
}.standardOutput.asText.map { it.trim() }.orElse('unknown')

// Mirrors ant setBuildTimestamp: "reproducible" when -Dbuild.reproducible is
// set, else the current UTC time
ext.buildTimestamp = providers.provider {
    if (System.getProperty('build.reproducible') != null) {
        'reproducible'
    } else {
        def fmt = new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss z', Locale.ENGLISH)
        fmt.setTimeZone(TimeZone.getTimeZone('UTC'))
        fmt.format(new Date())
    }
}

// JDK 8 javac used for all compilation, matching the ant build
ext.jdk8Home = providers.gradleProperty('jdk8Home').orElse('/usr/lib/jvm/java-8-openjdk-amd64').get()

def releaseVersion = getReleaseVersion()
def buildVersion = getBuildVersion()
def buildExtra = getBuildExtra()
def fullVersion = "$releaseVersion-$buildVersion$buildExtra"
ext.fullVersion = fullVersion
ext.buildExtra = buildExtra

def builtBy = getBuiltBy()
ext.builtBy = builtBy

subprojects {
    // Only apply to actual projects, not container directories
    if (project.name == 'apps') {
        return
    }

    buildDir = file("/tmp/build-i2p/gradle/${project.path.replace(':', '/').replaceFirst('/', '')}")

    apply plugin: 'java'
    apply plugin: 'java-library'
    // Coverage is opt-in (-Pcoverage). Applying jacoco unconditionally attaches its
    // agent to every `test` task, so the agent artifact must be resolvable for tests
    // to run at all - which makes the whole suite unrunnable offline, or on a
    // machine that never fetched it, for a tool the tests themselves do not need.
    if (gradle.startParameter.projectProperties.containsKey('coverage')) {
        apply plugin: 'jacoco'
    }

    // Match the ant build (JDK 8 javac, -source/-target 1.8, debug on) so
    // both produce identical bytecode and synthetic classes; newer javac
    // versions don't emit the synthetic switch-map classes (EepGet$2 etc.),
    // so bytecode wouldn't match ant's jars
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.fork = true
        options.forkOptions.javaHome = file(rootProject.ext.jdk8Home)
        options.compilerArgs += ['-source', '1.8', '-target', '1.8']
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        // https://stackoverflow.com/questions/44493378/whats-the-difference-between-api-api-and-compile-api
        // Pinned, not "4.+": a floating version means two runs of the same commit
        // can resolve different JUnit builds, so a green suite cannot be quoted
        // as evidence about the source. 4.13.2 is the latest 4.x and is what the
        // dependency cache resolves today.
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.hamcrest:hamcrest-library:1.3'
        testImplementation 'org.mockito:mockito-core:4.11.0'
    }

    test {
        // Match the ant junit batchtest: only top-level *Test classes run.
        // Inner helper classes (FooTest$Bar) and abstract *TestBase bases
        // are not runnable JUnit classes and are skipped.
        setIncludes(['**/*Test.class'])
        exclude '**/*$*'

        // Write JUnit XML into the same layout as the ant suite (run-tests.sh):
        // /tmp/test-i2p/<module>/junit, outside the workspace. The aggregate
        // testReport task below renders dist/test-report.html from these.
        def junitDir = file("${System.getProperty('java.io.tmpdir')}/test-i2p/${project.name}/junit")
        reports.junitXml.outputLocation.set(junitDir)
        doFirst { junitDir.deleteDir() }
        outputs.dir junitDir

        // I2PAppContext defaults i2p.dir.base to user.dir (the test worker CWD,
        // which is the module source dir), so SnarkManager/I2PSnarkUtil and other
        // context-driven code would write *.config, *.config.d/, dht.dat, torrent
        // dirs, etc. into the workspace. Point it at a scratch dir under the
        // system temp path (same base as junitDir), created for the run and
        // removed again once the task completes. Config/router/log/app/pid dirs
        // all inherit base.
        def ctxBase = file("${System.getProperty('java.io.tmpdir')}/test-i2p/${project.name}/base")
        systemProperty 'i2p.dir.base', ctxBase
        doFirst { ctxBase.deleteDir(); ctxBase.mkdirs() }
        // deleteDir() on the captured File, not project.delete(): resolving
        // `project` here is read at execution time, which the configuration cache
        // (on by default in gradle.properties) rejects and which made `test` fail
        // outright before a single test ran.
        doLast { ctxBase.deleteDir() }

        // Without this a failure prints the test name and nothing else, so the
        // assertion message that explains it is invisible unless the caller adds
        // --info. A red suite you cannot diagnose is worse than no report.
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
            showStandardStreams = false
        }
    }
}

// Skip translation bundling for dev builds: gradle -PnoBundle
// The bundle tasks run bundle-messages.sh, compiling .po translations into
// ResourceBundle classes inside the jars/wars. Translations are regenerated
// only just before a release, so daily zips (updaterCompact / updater200Compact)
// can omit them, matching ant's compact targets (no.bundle)
if (gradle.startParameter.projectProperties.containsKey('noBundle')) {
    allprojects {
        tasks.configureEach {
            if (name in ['bundle', 'bundleProxy', 'bundleCountries', 'bundleNews']) {
                enabled = false
            }
        }
    }
}

// Consolidated HTML report, identical to the ant `test` target's artifact:
// aggregates each module's JUnit XML (written to /tmp/test-i2p/<module>/junit
// by the subproject test tasks, which run in parallel via org.gradle.parallel)
// with the shared tools/test/unit-tests-to-html.py generator.
def subprojectTestTasks = subprojects.findAll { it.name != 'apps' }.collect { it.tasks.named('test') }

tasks.register('testReport', Exec) {
    dependsOn subprojectTestTasks
    def resultsDir = "${System.getProperty('java.io.tmpdir')}/test-i2p"
    def report = file("${rootDir}/dist/test-report.html")
    commandLine 'python3', "${rootDir}/tools/test/unit-tests-to-html.py", resultsDir, report
}

tasks.named('test') {
    dependsOn tasks.named('testReport')
}

// ./gradlew bench: alias for :core:jmh (me.champeau.jmh plugin, configured in
// core/build.gradle), mirroring ant's bench target - both run the benchmarks
// in core/java/bench. Tune by editing the jmh { } block in core/build.gradle
// (fork, warmupIterations, iterations, includes).
tasks.register('bench') {
    description = 'Run the JMH crypto benchmarks (alias for :core:jmh)'
    dependsOn project(':core').tasks.named('jmh')
}

// ./gradlew bench-fast: same benchmarks with the minimum profile
// (1 fork, 1 warmup + 1 measurement iteration), mirroring ant's bench-fast.
tasks.register('bench-fast') {
    description = 'Run the JMH crypto benchmarks with the minimum profile'
    dependsOn project(':core').tasks.named('jmh')
}

// Coverage report. Only registered when jacoco is applied (-Pcoverage); the
// JacocoReport type does not exist otherwise, so registering it unconditionally
// would break the default build.
if (gradle.startParameter.projectProperties.containsKey('coverage')) {
    task codeCoverageReport(type: JacocoReport) {
        // Skip this task if no Java projects are found
        doFirst {
            def javaProjects = subprojects.findAll { it.name != 'apps' && it.hasProperty('java') }
            if (javaProjects.isEmpty()) {
                println "No Java projects found for coverage report"
                return
            }
        }
    }
}

ext.pkgTempDir = "${System.getProperty('java.io.tmpdir')}/build-i2p/pkg-temp"

// Final artifacts (i2pupdate.zip, i2p.tar.bz2, *.deb) land in dist/, as in ant
ext.distDir = file('dist')

apply from: file('tools/gradle/update.gradle')
apply from: file('tools/gradle/package.gradle')
apply from: file('tools/gradle/installer.gradle')
apply from: file('tools/gradle/selftest.gradle')

plugins {
    id 'java-library'
}

sourceSets {
    main {
        java {
            srcDir 'java/src'
        }
    }
// The SAM client API is not part of the update payload (ant sam.jar)
tasks.named('jar') {
    exclude 'net/i2p/sam/client/**'
}

test {
        java {
            srcDir 'java/test'
        }
    }
}

dependencies {
    api project(':core')
    api project(':apps:ministreaming')
    api 'gnu.getopt:java-getopt:1.0.13'
    testImplementation 'junit:junit:4.13.2'
}

test {
    failOnNoDiscoveredTests = false
    // SAM tests are manual integration tests with main() methods, not JUnit
    exclude '**/*'
}

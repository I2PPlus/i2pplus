CLASS=net.i2p.i2ptunnel.web.messages
PO_GLOB=../locale/messages_*.po
# The console strings live in the precompiled JSPs. 'precompilejsp' writes
# them to $jsp.build.dir (== $BD/../../jsp), so scan the generated Java there
# rather than ../jsp, which holds only .jsp/.jsi sources that xgettext cannot
# read. Pointing at ../jsp/WEB-INF matched no path at all and left the
# template at 41 msgids instead of ~525.
JPATHS="../java/src $BD/../../jsp/WEB-INF/classes"
XGETTEXT_KEYWORDS="--keyword=_t --keyword=_x --keyword=intl._ --keyword=intl.title --keyword=unlessAdvanced"
PACKAGE_PATH=net/i2p/i2ptunnel/web
CLASS_OUTPUT_DIR=$BD/../../jsp/WEB-INF/classes

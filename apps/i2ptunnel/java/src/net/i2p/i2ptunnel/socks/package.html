<p>
    SOCKS 4, 4a and 5 server implementations exposing I2P client tunnels to SOCKS clients. The SOCKS client protocol code is in {@link net.i2p.socks}.
</p>
<p>
    See also: <a href="https://datatracker.ietf.org/doc/html/rfc1928">RFC 1928 (SOCKS5)</a> &bull; <a href="https://datatracker.ietf.org/doc/html/rfc1929">RFC 1929 (username and password authentication)</a>.

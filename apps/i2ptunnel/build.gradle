plugins {
    id 'java-library'
    id 'war'
}

sourceSets {
    main {
        java {
            srcDir 'java/src'
            srcDir "$buildDir/messages-src"
            srcDir "$buildDir/messages-proxy-src"
        }
    }
    test {
        java {
            srcDir 'java/test/junit'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':core')
    api project(':apps:ministreaming')
    api 'gnu.getopt:java-getopt:1.0.13'
    api project(':apps:jetty')
    
    // seems like it should be compileOnly but that doesn't work
    implementation 'org.apache.ant:ant:1.10.14'
    api fileTree("../jetty/apache-tomcat-${tomcatVersion}")
}

// Create the java files from the po files. The jar task will compile them.
// This requires gettext 0.19 or higher.
// We don't support the "slow way"
// bundle-messages.sh exits fast when all locale classes are current
def buildDirPath = buildDir
task bundleProxy(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/i2ptunnel/java', '--cfg', 'bundle-messages-proxy.cfg', '--build-dir', buildDirPath.absolutePath
}

task bundle(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/i2ptunnel/java', '--build-dir', buildDirPath.absolutePath
}
compileJava.dependsOn bundle, bundleProxy

task i2ptunnelJar(type: Jar) {
    from sourceSets.main.output 
    exclude '**/web/*.class'
    exclude '**/ui/*.class'
    exclude '**/EditBean.class'
    exclude '**/IndexBean.class'
    manifest {
        attributes 'Main-Class': 'net.i2p.i2ptunnel.I2PTunnel'
        attributes 'Class-Path': 'i2p.jar mstreaming.jar'
    }
    from ('resources', {
        into "net/i2p/i2ptunnel/resources"
    })
    from ('../routerconsole/jsp', {
        include 'themes/console/*/*.css'
        include 'themes/console/images/i2plogo.png'
        include 'themes/console/images/favicon.ico'
        include 'themes/console/images/itoopie_sm.png'
        into "net/i2p/i2ptunnel/resources"
    })
}

// i2ptunnelJar above is the shipping jar; the default jar would overwrite it
jar.enabled = false

task helpersJar(type: Jar) {
    from sourceSets.main.output
    include '**/EditBean.class'
    include '**/IndexBean.class'
    include 'net/i2p/i2ptunnel/ui/**'
    include 'net/i2p/i2ptunnel/web/SSLHelper.class'
    archiveBaseName='i2pTunnelHelpers'
}

task copyJsps(type: Copy) {
    doFirst {
        def f = new File("${buildDirPath}/jsp_copy")
        f.mkdirs()
    }
    from("jsp")
    include("**/*.jsp")
    include("**/*.jsi")
    into("${buildDirPath}/jsp_copy")

    doLast {
        (new File("${buildDirPath}/jsp_copy").listFiles() ?: []).each {
            if (it.getName().endsWith("jsi"))
                it.setLastModified(0)
        }
    }
}

// JspC classpath, and the same files the generated servlets compile against.
// Resolved at execution, after :apps:jetty is configured (config cache)
def jspcJarFile = project.provider { project(':apps:jetty').jspcJar.archiveFile.get().asFile }
def jspClasspath = sourceSets.main.runtimeClasspath + files(jspcJarFile)

task precompileJsp(type : JavaExec) {
    dependsOn copyJsps, ':apps:jetty:jspcJar'
    classpath = jspClasspath
    def projectDirPath = projectDir
    mainClass.set('net.i2p.servlet.util.JspC')
    doFirst {
        new File("${buildDirPath}/jsp_classes").mkdirs()
    }

    // Not required, and it is the one input to the generated servlets that is not a
    // source file: Jasper registers every .tld found in any scanned jar by URI, first
    // writer wins (a duplicate URI is only a warning), so a jar added to or reordered
    // on the build classpath can change what a taglib URI resolves to. No page here
    // declares a taglib, so the scan can only ever add bindings the pages never use.
    // Skipping it makes the compile a function of the pages alone. The filter
    // consults the skip list first; with no jarsToScan list nothing is scanned back in.
    jvmArgs "-Dtomcat.util.scan.StandardJarScanFilter.jarsToSkip=*"
    jvmArgs "-Dbuild.reproducible=true"

    args "-d"
    args "${buildDirPath}/jsp_classes"
    args "-v"
    args "-p"
    args "net.i2p.i2ptunnel.jsp"
    args "-webinc"
    args "${buildDirPath}/web-fragment.xml"
    args "-webapp"
    args "${buildDirPath}/jsp_copy"
    doLast {
        def fragment = new File("${buildDirPath}/web-fragment.xml").text
        def templateXML = new File(projectDirPath, "jsp/web.xml").text
        def webXML = templateXML.replace("<!-- precompiled servlets -->", fragment)

        def multipart = "<multipart-config>" +
                        "<max-file-size>134217728</max-file-size>" +
                        "<max-request-size>134217728</max-request-size>" +
                        "<file-size-threshold>262144</file-size-threshold>" +
                        "</multipart-config>"

        def multipartServlets = ["register"]
                                

        multipartServlets = multipartServlets.collect {
            "<servlet-class>net.i2p.i2ptunnel.jsp.${it}_jsp</servlet-class>"
        }

        multipartServlets.each {
            webXML = webXML.replace(it, it + multipart)
        }

        new File("${buildDirPath}/web.xml").text = webXML
    }

}

// Compile the servlets JspC generated. A JavaCompile task, so it inherits the
// project-wide javac pin (forked JDK 8, -source/-target 1.8, UTF-8) every other
// compile here uses, which is also the bytecode level of ant's jsp target. The
// ant call this replaces took source/target from the java extension, unset in
// this module, so the generated servlets came out at whatever JDK ran the build
// and the war shipped classes a Java 8 router cannot load.
task compileJsps(type: JavaCompile) {
    dependsOn precompileJsp
    source = fileTree("${buildDirPath}/jsp_classes")
    classpath = jspClasspath
    destinationDirectory.set(file("${buildDirPath}/compiledJsps"))
    // ant's javac sets deprecation="on"
    options.deprecation = true
}

i2ptunnelJar.dependsOn bundleProxy
// Static check of the pages.  Optional, like uglifyjs in the ant build: it runs
// only when python3 and the script are both there.  Any finding from the
// correctness or security audit fails the build.
task checkJsps(type: Exec) {
    def script = new File(rootDir, 'tools/scripts/checkjsps.py')
    // resolved through PATH, not /usr/bin, so Windows and non-FHS installs work
    def python = ['python3', 'python', 'python3.exe', 'python.exe'].find { name ->
        (System.getenv('PATH') ?: '').split(File.pathSeparator).any { dir -> new File(dir, name).canExecute() }
    }
    def runnable = python != null && script.isFile()
    onlyIf { runnable }
    if (runnable)
        commandLine python, script.absolutePath, '--app', 'i2ptunnel'
}

war.dependsOn bundle,precompileJsp,compileJsps,checkJsps

// not needed unless we're building for both android and regular
task tempBeansJar(type: Jar) {
    from sourceSets.main.output
    include '**/EditBean.class'
    include '**/ui/*.class'
    include '**/IndexBean.class'
    archiveBaseName = 'temp-beans'
}

// only for android
task uiJar(type: Jar) {
    archiveBaseName = 'i2ptunnel-ui'
    from sourceSets.main.output
    include '**/ui/*.class'
    manifest {
        attributes 'Class-Path' : 'i2p.jar mstreaming.jar i2ptunnel.jar'
    }
}

assemble.dependsOn i2ptunnelJar, war   //, tempBeansJar, uiJar

war {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    include '**/EditBean.class'
    include '**/ui/*.class'
    include '**/IndexBean.class'
    from 'jsp'
    from ("$buildDir/compiledJsps") {
        include '**/*.class'
        into "WEB-INF/classes"
    }
    rootSpec.exclude('**/*.jar')
    rootSpec.exclude('/net/i2p/i2ptunnel/*.class')
    rootSpec.exclude('/net/i2p/i2ptunnel/access')
    rootSpec.exclude('/net/i2p/i2ptunnel/irc')
    rootSpec.exclude('/net/i2p/i2ptunnel/localServer')
    rootSpec.exclude('/net/i2p/i2ptunnel/proxy')
    rootSpec.exclude('/net/i2p/i2ptunnel/socks')
    rootSpec.exclude('/net/i2p/i2ptunnel/streamr')
    rootSpec.exclude('/net/i2p/i2ptunnel/udp')
    rootSpec.exclude('/net/i2p/i2ptunnel/udpTunnel')
    from("jsp") {
        exclude 'web.xml'
        exclude '*.jsi'
        exclude '*.jsp'
    }
    webXml = file("$buildDir/web.xml")
}


sourceSets {
    main {
        java {
            srcDir 'java/src'
            srcDir "$buildDir/messages-src"
        }
    }
    test {
        java {
            srcDir 'java/test'
        }
        resources {
            srcDir 'java/test/junit'
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':apps:jetty')
    implementation project(':apps:ministreaming')
    implementation project(':router')
    testImplementation 'junit:junit:4.13.2'
}

// Create the java files from the po files. The jar task will compile them.
// This requires gettext 0.19 or higher.
// We don't support the "slow way"
// bundle-messages.sh exits fast when all locale classes are current
def buildDirPath = buildDir
task bundle(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/addressbook/java', '--build-dir', buildDirPath.absolutePath
}
compileJava.dependsOn bundle
jar.dependsOn bundle

// Intentionally empty war, shipped as webapps/addressbook.war (ant emptyWar)
task war(type: Jar) {
    archiveFileName = 'addressbook.war'
    manifest {
        attributes 'Note': 'Intentionally empty'
    }
}

// Explicit dependency: test classpath resolves i2ptunnel.jar transitively via :router
test.dependsOn ':apps:i2ptunnel:i2ptunnelJar'

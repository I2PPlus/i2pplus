<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>I2PSnark Magnet Bridge Options</title>
<style>
  :root { color-scheme: light dark; --text: #222; --bg: #fff; --muted: #666; --accent: #0a0; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #eee; --bg: #23222b; --muted: #aaa; --accent: #4c4; }
  }
  body { font-family: sans-serif; margin: 1.5em; max-width: 42em; background: var(--bg); color: var(--text); }
  h1 { font-size: 1.15em; margin-bottom: .2em; }
  p.hint { color: var(--muted); font-size: .88em; margin: .2em 0 0 1.7em; }
  label { display: block; margin: .8em 0; }
  input[type=checkbox] { vertical-align: middle; margin-right: .3em; }
  input[type=text] { width: 100%; max-width: 32em; box-sizing: border-box; }
  #saved { color: var(--accent); visibility: hidden; }
</style>
</head>
<body>
<h1>I2PSnark Magnet Bridge</h1>
<p class="hint" style="margin-left:0">Settings are saved immediately.</p>

<label><input type="checkbox" id="notifySuccess">Show a notification when a magnet is added</label>

<label><input type="checkbox" id="notifyFailure">Show a notification when adding a magnet fails</label>

<label><input type="checkbox" id="i2pOnly">Only handle magnet links on .i2p pages
  <p class="hint">Magnet links on other pages are ignored, and nothing is sent to I2PSnark.</p></label>

<label>I2PSnark URL
  <input type="text" id="overrideBaseUrl" placeholder="http://127.0.0.1:7657/i2psnark" spellcheck="false" autocomplete="off">
  <p class="hint">Leave empty to auto-detect the instance that served this extension. Set this to pin a specific instance, e.g. a standalone I2PSnark on http://127.0.0.1:8002/i2psnark.</p></label>

<p id="saved">Saved.</p>
<script src="options.js"></script>
</body>
</html>

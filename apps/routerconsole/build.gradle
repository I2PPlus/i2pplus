plugins {
    id 'java-library'
    id 'war'
    id 'scala'
}

sourceSets {
    main {
        java {
            srcDir 'java/src'
            srcDir "$buildDir/messages-src"
            srcDir "$buildDir/messages-countries-src"
            srcDir "$buildDir/messages-news-src"
        }
    }
    test {
        java {
            srcDir 'java/test/junit'
        }
    }
}

dependencies {
    api project(':core')
    api project(':router')
    api project(':installer')
    api 'gnu.getopt:java-getopt:1.0.13'

    api project(':apps:desktopgui')
    api project(':apps:systray')
    api project(':apps:jetty')
    api project(':apps:jrobin')
    api project(':apps:sam')
    api project(':apps:i2ptunnel')
    api files('../../installer/lib/wrapper/all/wrapper.jar')
    api fileTree("../jetty/jetty-distribution-${jettyVersion}")

    // seems like it should be compileOnly but that doesn't work
    implementation 'org.apache.ant:ant:1.10.14'
    api fileTree("../jetty/apache-tomcat-${tomcatVersion}")
    // don't use 2.12.4, stack overflow: https://github.com/sbt/zinc/issues/1010
    // Updated to 2.12.19 for Java 21 compatibility
    testImplementation "org.scala-lang:scala-library:2.12.19"
    testImplementation 'org.scalatest:scalatest_2.12:3.0.9'
}

if (System.getenv("TARGET_JAVA_HOME") == null && JavaVersion.current() != JavaVersion.VERSION_1_7) {
    sourceSets {
        test {
            scala {
                srcDir 'java/test/scalatest'
            }
        }
    }
    task scalaTest(dependsOn: ['testClasses'], type: JavaExec) {
        mainClass.set('org.scalatest.tools.Runner')
        args = ['-R', 'build/classes/scala/test', '-o']
        classpath = java.sourceSets.test.runtimeClasspath
    }

    // The i2ptunnel project ships its jar via the custom i2ptunnelJar task
    // (default jar disabled); the test classpath uses it as an artifact.
    test.dependsOn ':apps:i2ptunnel:i2ptunnelJar'

    // java.lang.NullPointerException:
    //  at net.i2p.router.update.PluginUpdateHandler.<init>(PluginUpdateHandler.java:36)
    //  at net.i2p.router.update.PluginUpdateHandlerSpec.pluginUpdateHandler(PluginUpdateHandlerSpec.scala:19)
    //test.dependsOn scalaTest
}

// Create the java files from the po files. The jar task will compile them.
// This requires gettext 0.19 or higher.
// We don't support the "slow way"
// bundle-messages.sh exits fast when all locale classes are current
def buildDirPath = buildDir

// Mirrors the ant <manifest> blocks for routerconsole.jar and routerconsole.war
// (Ant-Version and Created-By are attributes ant's jar/war tasks add
// automatically, derived from the JDK 8 the ant build runs on)
def consoleManifestAttrs = [
    'Ant-Version': 'Apache Ant 1.10.17',
    'Created-By': '1.8.0_502-8u502-ga~us1-0ubuntu1-b07 (Private Build)',
    'Implementation-Version': rootProject.ext.fullVersion,
    'Built-By': rootProject.ext.builtBy,
    'Build-Date': rootProject.ext.buildTimestamp,
    'Base-Revision': rootProject.ext.workspaceVersion,
    'X-Compile-Source-JDK': '1.8',
    'X-Compile-Target-JDK': '1.8',
]

// Mirrors ant listChangedFiles (jar) / listChangedFiles2 (war): the paths
// changed vs HEAD plus untracked files, whitespace collapsed to commas, as
// ant does with `git ... && git ...` piped through `tr -s '[:space:]' ','`.
// A clean tree yields "" in both builds; git failure falls back to "" too
// (ant's failifexecutionfails="false").
def workspaceChanges = { List<String> paths ->
    providers.exec {
        commandLine 'sh', '-c', "git diff --name-only HEAD -- ${paths.join(' ')} && git ls-files --others --exclude-standard ${paths.join(' ')}"
        workingDir = rootDir
    }.standardOutput.asText.map { it.replaceAll(/[[:space:]]+/, ',').trim() }.orElse('')
}
task bundleCountries(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/routerconsole/java', '--cfg', 'bundle-messages-countries.cfg', '--build-dir', buildDirPath.absolutePath
}
task bundleNews(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/routerconsole/java', '--cfg', 'bundle-messages-news.cfg', '--build-dir', buildDirPath.absolutePath
}
task bundleJar {
    dependsOn bundleCountries, bundleNews
}
task bundle(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/routerconsole/java', '--build-dir', buildDirPath.absolutePath
}
compileJava.dependsOn bundle, bundleJar

task consoleJar(type: Jar) {
    from sourceSets.main.output
    // These stay out of the jar; the war carries them (ant routerconsole.jar)
    exclude 'net/i2p/router/web/helpers/**'
    exclude 'net/i2p/router/web/servlets/**'
    exclude 'net/i2p/router/web/resources/**'
    manifest {
        // Top level installer will rename to jrobin.jar
        // DTG added in 0.8.4, not in the classpath for very old installs,
        // before we changed wrapper.config to specify *
        // very old installs don't have i2psnark,jstl,standard in the classpath...
        // not added in WebAppConfiguration any more
        // All new jetty 7 jars should have been in 0.9.6, added in 0.9.7
        attributes consoleManifestAttrs + [
            'Class-Path': 'i2p.jar router.jar jrobin.jar desktopgui.jar i2psnark.jar jstl.jar standard.jar jstlel.jar jetty-continuation.jar jetty-http.jar jetty-io.jar jetty-security.jar jetty-servlet.jar jetty-servlets.jar jetty-util.jar jetty-webapp.jar',
            'Main-Class': 'net.i2p.router.news.CommandLine',
            'Workspace-Changes': workspaceChanges(['apps/routerconsole/java', 'apps/routerconsole/locale']),
        ]
    }
    // NDT translations (ant jar1 copies these into the jar)
    from ('java/src/edu/internet2/ndt/locale', {
        include 'Tcpbw100_msgs_*.properties'
        into 'edu/internet2/ndt/locale'
    })
    // English as the default/fallback bundle (no locale suffix), as ant does
    from ('java/src/edu/internet2/ndt/locale/Tcpbw100_msgs_en.properties') {
        into 'edu/internet2/ndt/locale'
        rename { 'Tcpbw100_msgs.properties' }
    }
}

task helpersJar(type: Jar) {
    from sourceSets.main.output
    include 'net/i2p/router/web/helpers/**'
    archiveBaseName = 'consoleHelpers'
}

task copyJsps(type: Copy) {
    doFirst {
        def f = new File("${buildDirPath}/jsp_copy")
        f.mkdirs()
    }
    from("jsp") 
    include("**/*.jsp")
    include("**/*.jsi")
    into("${buildDirPath}/jsp_copy")
    
    doLast {
        (new File("${buildDirPath}/jsp_copy").listFiles() ?: []).each {
            if (it.getName().endsWith("jsi"))
                it.setLastModified(0)
        }
    }
}

// JspC classpath, and the same files the generated servlets compile against.
// Resolved at execution, after :apps:jetty is configured (config cache)
def jspcJarFile = project.provider { project(':apps:jetty').jspcJar.archiveFile.get().asFile }
def jspClasspath = java.sourceSets.main.runtimeClasspath + files(jspcJarFile)

task precompileJsp(type: JavaExec) {
    dependsOn copyJsps, ':apps:i2ptunnel:i2ptunnelJar', ':apps:jetty:jspcJar'
    classpath = jspClasspath
    def projectDirPath = projectDir
    mainClass.set('net.i2p.servlet.util.JspC')
    doFirst {
        new File("${buildDirPath}/jsp_classes").mkdirs()
    }

    // Not required, and it is the one input to the generated servlets that is not a
    // source file: Jasper registers every .tld found in any scanned jar by URI, first
    // writer wins (a duplicate URI is only a warning), so a jar added to or reordered
    // on the build classpath can change what a taglib URI resolves to. No page here
    // declares a taglib, so the scan can only ever add bindings the pages never use.
    // Skipping it makes the compile a function of the pages alone. The filter
    // consults the skip list first; with no jarsToScan list nothing is scanned back in.
    jvmArgs "-Dtomcat.util.scan.StandardJarScanFilter.jarsToSkip=*"
    jvmArgs "-Dbuild.reproducible=true"
    
    args "-d"
    args "${buildDirPath}/jsp_classes"
    args "-v"
    args "-p"
    args "net.i2p.router.web.jsp"
    args "-webinc"
    args "${buildDirPath}/web-fragment.xml"
    args "-webapp"
    args "${buildDirPath}/jsp_copy"
    doLast {
        def fragment = new File("${buildDirPath}/web-fragment.xml").text
        def templateXML = new File(projectDirPath, "jsp/web.xml").text
        def webXML = templateXML.replace("<!-- precompiled servlets -->", fragment)

        def multipart = "<multipart-config>" +
                        "<max-file-size>134217728</max-file-size>" +
                        "<max-request-size>134217728</max-request-size>" +
                        "<file-size-threshold>262144</file-size-threshold>" +
                        "</multipart-config>"

        def multipartServlets = ["configplugins",
                                "configfamily",
                                "configreseed"]

        multipartServlets = multipartServlets.collect {
            "<servlet-class>net.i2p.router.web.jsp.${it}_jsp</servlet-class>"
        }

        multipartServlets.each {
            webXML = webXML.replace(it, it + multipart)
        }

        new File("${buildDirPath}/web.xml").text = webXML
    }

}

// Compile the servlets JspC generated. A JavaCompile task, so it inherits the
// project-wide javac pin (forked JDK 8, -source/-target 1.8, UTF-8) every other
// compile here uses, which is also the bytecode level of ant's jsp target.
task compileJsps(type: JavaCompile) {
    dependsOn precompileJsp
    source = fileTree("${buildDirPath}/jsp_classes")
    classpath = jspClasspath
    destinationDirectory.set(file("${buildDirPath}/compiledJsps"))
    // ant's javac sets deprecation="on"
    options.deprecation = true
}

// Mirrors ant bundleTranslationReport: run net.i2p.util.TranslationStatus -h
// (tools.jar + i2p.jar) and bundle the report plus its md5 into the war.
//
// The report reads the compiled message bundles out of the built jars and wars.
// ant runs the tool in the shared build directory, so the tool's default file list
// resolves there; gradle keeps one output directory per module, so name the
// artifacts instead and nothing goes missing. Same order as the tool's own JARS
// list, so the report is the one ant writes. A null project means this one.
//
// evaluationDependsOn: under configure-on-demand the other projects would still be
// unconfigured when this script reads their archive paths, and their war tasks in
// particular would not exist yet.
def txReportArtifacts = [
    [':apps:desktopgui', 'jar'],        [':core', 'jar'],
    [':apps:i2psnark', 'war'],          [':apps:i2ptunnel', 'i2ptunnelJar'],
    [':apps:i2ptunnel', 'war'],         [':apps:ministreaming', 'jar'],
    [':router', 'jar'],                 [null, 'consoleJar'],
    [':apps:susidns', 'war'],           [':apps:susimail', 'war'],
]
([':installer'] + txReportArtifacts.collect { it[0] }.findAll { it != null }).each {
    evaluationDependsOn(it)
}
// Resolves an artifact's archive task. A script-level closure, not one written
// inside the task below: a task configuration closure dispatches to the task
// first, where bare `project` is not the project.
def txTaskProvider = { path, name ->
    (path == null ? project : project(path)).tasks.named(name)
}

task generateTxStatus(type: JavaExec) {
    dependsOn ':installer:toolsJar', ':core:jar'
    dependsOn txReportArtifacts.collect { path, name -> txTaskProvider(path, name) }
    mainClass.set('net.i2p.util.TranslationStatus')
    classpath = files(
        project(':installer').tasks.named('toolsJar').flatMap { it.archiveFile },
        project(':core').tasks.named('jar').flatMap { it.archiveFile }
    )
    systemProperty 'i2p.src.dir', rootDir
    args '-h'
    txReportArtifacts.each { path, name ->
        // archiveFile is a computed output location, so this is the path of the
        // artifact without running the task that builds it
        def artifact = txTaskProvider(path, name).get().archiveFile.get().asFile.absolutePath
        args(artifact)
    }
    doFirst {
        def outFile = new File("${buildDirPath}/txstatus/WEB-INF/classes/net/i2p/router/web/resources/translationstatus.html")
        outFile.parentFile.mkdirs()
        standardOutput = new FileOutputStream(outFile)
    }
    doLast {
        def html = new File("${buildDirPath}/txstatus/WEB-INF/classes/net/i2p/router/web/resources/translationstatus.html")
        def digest = java.security.MessageDigest.getInstance('MD5')
        html.eachByte { digest.update(it) }
        def md5 = digest.digest().collect { String.format('%02x', it) }.join()
        def md5File = new File("${buildDirPath}/txstatus/txstatus.md5")
        if (!md5File.exists() || md5File.text != md5 + '\n') {
            // trailing newline matches ant's <echo file>, for byte equality
            md5File.text = md5 + '\n'
        }
    }
}

consoleJar.dependsOn bundleJar
// Static check of the pages.  Optional, like uglifyjs in the ant build: it runs
// only when python3 and the script are both there.  Any finding from the
// correctness or security audit fails the build.
task checkJsps(type: Exec) {
    def script = new File(rootDir, 'tools/scripts/checkjsps.py')
    // resolved through PATH, not /usr/bin, so Windows and non-FHS installs work
    def python = ['python3', 'python', 'python3.exe', 'python.exe'].find { name ->
        (System.getenv('PATH') ?: '').split(File.pathSeparator).any { dir -> new File(dir, name).canExecute() }
    }
    def runnable = python != null && script.isFile()
    onlyIf { runnable }
    if (runnable)
        commandLine python, script.absolutePath, '--app', 'routerconsole'
}

war.dependsOn(bundle,precompileJsp,compileJsps,checkJsps,generateTxStatus)

war {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // ant's war carries only the helpers/servlets/resources classes and the
    // precompiled JSPs; the rest of the classes ship in routerconsole.jar
    rootSpec.exclude('**/*.jar')
    rootSpec.exclude('com/**')
    rootSpec.exclude('edu/**')
    rootSpec.exclude('net/i2p/router/countries/**')
    rootSpec.exclude('net/i2p/router/news/**')
    rootSpec.exclude('net/i2p/router/update/**')
    // ant's war carries only helpers/servlets/resources plus the precompiled
    // JSPs; the top-level web classes and the generated message classes ship
    // in routerconsole.jar
    rootSpec.exclude('net/i2p/router/web/*.class')
    rootSpec.exclude('net/i2p/router/web/messages/**')
    rootSpec.exclude('net/i2p/servlet/**')
    // jasper-generated sources and classes; ant has both under WEB-INF/classes
    from ("$buildDir/jsp_classes") {
        into "WEB-INF/classes"
    }
    from ("$buildDir/compiledJsps") {
        into "WEB-INF/classes"
    }
    from ('jsp') {
        exclude 'web.xml'
        exclude '*.jsi'
        exclude '*.jsp'
    }
    webXml = file("$buildDir/web.xml")
    from ('resources', {
        into "WEB-INF/classes/net/i2p/router/web/resources"
    })
    from ("$buildDir/txstatus")
    manifest {
        attributes consoleManifestAttrs + [
            'Workspace-Changes': workspaceChanges(['apps/routerconsole/jsp']),
        ]
    }
}

// consoleJar above is the shipping jar; the default jar would overwrite it
jar.enabled = false

assemble.dependsOn war, consoleJar


plugins {
    id 'java-library'
    id 'war'
}

sourceSets {
    main {
        java {
            srcDir 'java'
            // The JUnit sources live under this same root, because that is where
            // apps/i2pcontrol/build.xml looks for them. Without this exclude they are
            // compiled as main sources - and junit is not on the main classpath, so
            // they fail there - and the javadoc task, which documents the main source
            // set, reports "package org.junit does not exist" for them.
            exclude 'test/**'
        }
    }
    test {
        java {
            srcDir 'java/test/junit'
        }
    }
}

dependencies {
    api project(':router')
    api project(':apps:jetty')
    api files('../../installer/lib/wrapper/all/wrapper.jar')
    api fileTree("../jetty/apache-tomcat-${tomcatVersion}")
    api fileTree("../jetty/jetty-distribution-${jettyVersion}")
}

war {
    archiveBaseName.set('jsonrpc')
    rootSpec.exclude('**/*.jar')
    webXml = file('web.xml')
    dependsOn ':apps:i2ptunnel:i2ptunnelJar'
}

plugins {
    id 'war'
}

sourceSets {
    main {
        java {
            srcDir 'src/src'
            srcDir "$buildDir/messages-src"
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':apps:jetty')
}

// Create the java files from the po files. The war task will compile them.
// This requires gettext 0.19 or higher.
// We don't support the "slow way"
// bundle-messages.sh exits fast when all locale classes are current
def buildDirPath = buildDir
task bundle(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/susimail', '--build-dir', buildDirPath.absolutePath
}
compileJava.dependsOn bundle
war.dependsOn bundle, ':apps:i2ptunnel:i2ptunnelJar'

war {
    rootSpec.exclude('**/*.jar')
    from 'src'
    exclude 'WEB-INF/web.xml'
    exclude 'LICENSE'
    exclude 'src'
    exclude 'WEB-INF/classes/'
    webInf {
        into 'classes'
        from 'src/susimail.properties'
        duplicatesStrategy = DuplicatesStrategy.INHERIT
    }
    webXml = file('src/WEB-INF/web.xml')
}

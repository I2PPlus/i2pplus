plugins {
    id 'java-library'
    id 'war'
}

sourceSets {
    main {
        java {
            srcDir 'src/java/src'
            srcDir "$buildDir/messages-src"
        }
    }
}

dependencies {
    implementation project(':core')
    implementation project(':apps:jetty')
    implementation project(':apps:addressbook')

    // seems like it should be compileOnly but that doesn't work
    implementation 'org.apache.ant:ant:1.10.14'
    implementation fileTree("../jetty/apache-tomcat-${tomcatVersion}")
    implementation fileTree("../jetty/jetty-distribution-${jettyVersion}")
}

// Create the java files from the po files. The war task will compile them.
// This requires gettext 0.19 or higher.
// We don't support the "slow way"
// bundle-messages.sh exits fast when all locale classes are current
def buildDirPath = buildDir
task bundle(type: Exec) {
    workingDir rootDir
    commandLine 'sh', 'tools/scripts/bundle-messages.sh', '--dir', 'apps/susidns/src', '--build-dir', buildDirPath.absolutePath
}
compileJava.dependsOn bundle

task copyJsps(type: Copy) {
    doFirst {
        def f = new File("${buildDirPath}/jsp_copy")
        f.mkdirs()
    }
    from("src/jsp")
    include("**/*.jsp")
    include("**/*.jsi")
    into("${buildDirPath}/jsp_copy")

    doLast {
        (new File("${buildDirPath}/jsp_copy").listFiles() ?: []).each {
            if (it.getName().endsWith("jsi"))
                it.setLastModified(0)
        }
    }
}

// JspC classpath, and the same files the generated servlets compile against.
// Resolved at execution, after :apps:jetty is configured (config cache)
def jspcJarFile = project.provider { project(':apps:jetty').jspcJar.archiveFile.get().asFile }
def jspClasspath = java.sourceSets.main.runtimeClasspath + fileTree("src/lib") + files(jspcJarFile)

task precompileJsp(type: JavaExec) {
    doFirst {
        new File("${buildDirPath}/tmp_jsp").mkdirs()
    }

    dependsOn copyJsps, ':apps:i2ptunnel:i2ptunnelJar',
              ':apps:jetty:jar', ':apps:jetty:jspcJar', ':apps:ministreaming:jar',
              ':core:jar', ':router:jar', ':apps:addressbook:jar'

    classpath = jspClasspath
    def projectDirPath = projectDir
    mainClass.set('net.i2p.servlet.util.JspC')

    // Two pages declare the JSTL taglib (addressbook.jsp, log.jsp) and it resolves
    // from src/lib/standard.jar, so that jar alone is scanned. Everything else is
    // skipped: the scan is the one input to the generated servlets that is not a
    // source file - Jasper registers every .tld it finds in any scanned jar by URI,
    // first writer wins (a duplicate URI is only a warning), so an unrelated jar on
    // the build classpath could otherwise supply the binding. The filter consults
    // the skip list first, then the scan list, so this is an allow-list.
    jvmArgs "-Dtomcat.util.scan.StandardJarScanFilter.jarsToSkip=*"
    jvmArgs "-Dtomcat.util.scan.StandardJarScanFilter.jarsToScan=standard.jar"
    jvmArgs "-Dbuild.reproducible=true"

    args "-d"
    args "${buildDirPath}/tmp_jsp"
    args "-v"
    args "-p"
    args "i2p.susi.dns.jsp"
    args "-webinc"
    args "${buildDirPath}/web-fragment.xml"
    args "-webapp"
    args "${buildDirPath}/jsp_copy"
    doLast {
        // Normalize the order of the _jspx_dependants entries Jasper emits for the
        // JSTL taglib so the generated servlet is byte-stable run to run (mirrors
        // ant's three replaceregexp passes: blank every put, then fill the first
        // with the jar:file form and the next with the file: form).
        def addressbook = new File("${buildDirPath}/tmp_jsp/i2p/susi/dns/jsp/addressbook_jsp.java")
        def generated = addressbook.text
        generated = generated.replaceAll(/_jspx_dependants\.put\(.*\);/, '//_jspx_dependants.put(@@@);')
        ['jar:file:lib/standard.jar!/META-INF/c.tld', 'file:lib/standard.jar'].each { dep ->
            generated = generated.replaceFirst(/\/\/_jspx_dependants\.put\(@@@\);/,
                java.util.regex.Matcher.quoteReplacement(
                    '_jspx_dependants.put("' + dep + '", Long.valueOf(1200000000000L));'))
        }
        addressbook.text = generated

        def fragment = new File("${buildDirPath}/web-fragment.xml").text
        def templateXML = new File(projectDirPath, "src/WEB-INF/web-template.xml").text
        def webXML = templateXML.replace("<!-- precompiled servlets -->", fragment)

        def multipart = "<multipart-config>" +
                        "<max-file-size>134217728</max-file-size>" +
                        "<max-request-size>134217728</max-request-size>" +
                        "<file-size-threshold>262144</file-size-threshold>" +
                        "</multipart-config>"

        def multipartServlets = ["addressbook"]

        multipartServlets = multipartServlets.collect {
            "<servlet-class>net.i2p.router.web.jsp.${it}_jsp</servlet-class>"
        }

        multipartServlets.each {
            webXML = webXML.replace(it, it + multipart)
        }

        new File("${buildDirPath}/web.xml").text = webXML

    }
}

// Compile the servlets JspC generated. A JavaCompile task, so it inherits the
// project-wide javac pin (forked JDK 8, -source/-target 1.8, UTF-8) every other
// compile here uses, which is also the bytecode level of ant's jsp target. The
// ant call this replaces took source/target from the java extension, unset in
// this module, so the generated servlets came out at whatever JDK ran the build
// and the war shipped classes a Java 8 router cannot load.
task compileJsps(type: JavaCompile) {
    dependsOn precompileJsp
    source = fileTree("${buildDirPath}/tmp_jsp")
    classpath = jspClasspath
    destinationDirectory.set(file("${buildDirPath}/compiledJsps"))
    // ant's javac sets deprecation="on"
    options.deprecation = true
}

// Static check of the pages.  Optional, like uglifyjs in the ant build: it runs
// only when python3 and the script are both there.  Any finding from the
// correctness or security audit fails the build.
task checkJsps(type: Exec) {
    def script = new File(rootDir, 'tools/scripts/checkjsps.py')
    // resolved through PATH, not /usr/bin, so Windows and non-FHS installs work
    def python = ['python3', 'python', 'python3.exe', 'python.exe'].find { name ->
        (System.getenv('PATH') ?: '').split(File.pathSeparator).any { dir -> new File(dir, name).canExecute() }
    }
    def runnable = python != null && script.isFile()
    onlyIf { runnable }
    if (runnable)
        commandLine python, script.absolutePath, '--app', 'susidns'
}

war.dependsOn bundle,precompileJsp,compileJsps,checkJsps

war {
    rootSpec.exclude("**/*.jar")
    from 'src/jsp'
    from 'src/index.html'
    from ('src/js', {
        into "js"
    })
    from ('src/svg', {
        into "svg"
    })
    from ('src/themes', {
        into "themes"
    })
    from ("$buildDir/compiledJsps") {
        include '**/*.class'
        into 'WEB-INF/classes'
    }
    from ("../addressbook/build/classes/java/main") {
        include 'net/i2p/addressbook/messages*.class'
        into 'WEB-INF/classes'
    }
    exclude '*.jsi'
    exclude '*.jsp'
    webXml = file("$buildDir/web.xml")
}

assemble.dependsOn war


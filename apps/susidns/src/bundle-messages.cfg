CLASS=i2p.susi.dns.messages
PO_GLOB=../locale/messages_*.po
# The JSPs are the bulk of the user-visible strings, and JspC rewrites them into
# Java under jsp-output/tmp. xgettext must read those, or the nav bar, page
# titles and table headers never reach the catalogs. Mirrors the routerconsole
# config, which includes its precompiled JSP sources.
JPATHS="../src/java/ ../src/tmp/ $BD/HowSVG.java $BD/jsp-output/tmp"
XGETTEXT_KEYWORDS="--keyword=_ --keyword=_t --keyword=_x --keyword=intl._ --keyword=intl.title"
PACKAGE_PATH=i2p/susi/dns
CLASS_OUTPUT_DIR=$BD/classes
TMPFILE=$BD/javafiles.txt

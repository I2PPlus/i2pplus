<p>
    SOCKS 4 and SOCKS 5 client protocol implementations, extracted from i2ptunnel for broader use across I2P applications, including SSLEepGet. The SOCKS server implementation is in {@link net.i2p.i2ptunnel.socks}.
</p>

<p>
    See also: <a href="https://datatracker.ietf.org/doc/html/rfc1928">RFC 1928 (SOCKS5)</a> &bull; <a href="https://datatracker.ietf.org/doc/html/rfc1929">RFC 1929</a>.
</p>

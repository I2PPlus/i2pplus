getopt.ambigious={0}: l’opció ''{1}'' és ambigua
getopt.arguments1={0}: l’opció ''--{1}'' no admet cap argument
getopt.arguments2={0}: l’opció ''{1}{2}'' no admet cap argument
getopt.requires={0}: l’opció ''{1}'' requereix un argument
getopt.unrecognized={0}: opció no reconeguda ''--{1}''
getopt.unrecognized2={0}: opció no reconeguda ''{1}{2}''
getopt.illegal={0}: opció no permesa -- {1}
getopt.invalid={0}: opció no vàlida -- {1}
getopt.requires2={0}: l’opció requereix un argument -- {1}
getopt.invalidValue=Valor no vàlid {0} per al paràmetre 'has_arg' 

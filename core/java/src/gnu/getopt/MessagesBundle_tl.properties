getopt.ambigious={0}: ang option ''{1}'' ay ambiguo
getopt.arguments1={0}: ang option ''--{1}'' ay hindi pinapayagan ang isang argumento
getopt.arguments2={0}: ang option ''{1}{2}'' ay hindi pinapayagan ang isang argumento
getopt.requires={0}: kailangan ng option ''{1}'' ang isang argumento
getopt.unrecognized={0}: hindi kinilala ang option ''--{1}''
getopt.unrecognized2={0}: hindi kinilala ang option ''{1}{2}''
getopt.illegal={0}: hindi legal na option -- {1}
getopt.invalid={0}: hindi wasto ang option -- {1}
getopt.requires2={0}: kailangan ng option ang isang argumento -- {1}
getopt.invalidValue=Hindi wastong halaga {0} para sa parameter na 'has_arg'

// IzPack5 exe via izpack2exe.py (ant installer5exe), fixed to read dist/install.jar.
// Not launch4j: launch4j output cannot be Windows-signed. The script is Python 3
// but its shebang says python, so the interpreter is passed explicitly; it writes
// installer.7z and config.txt into the working directory, hence the scratch dir.
task installer5exe(type: Exec) {
  group = 'package'
  description = 'Build dist/i2pinstall.exe from dist/install.jar with IzPack5 izpack2exe.py (mirrors ant installer5exe).'
  dependsOn installer5
  onlyIf { launcherSupported }
  workingDir iz5exeWork
  commandLine iz5python, iz5exeScript, "--file=${distAbs}/install.jar",
      "--with-7z=${iz5exe7za}", '--no-upx', "--output=${distAbs}/i2pinstall.exe"
  outputs.file("${distAbs}/i2pinstall.exe")
  doFirst {
    if (!new File("${iz5home}/lib").isDirectory()) {
      throw new GradleException(izpack5Missing)
    }
    // the wrapper is not executable as shipped; the 7za has to be for the exec
    new File(iz5exeScript).setExecutable(true)
    new File(iz5exe7za).setExecutable(true)
    new File(iz5exeWork).mkdirs()
  }
  doLast {
    installerUtil.printSha(new File("${distAbs}/i2pinstall.exe"))
  }
}


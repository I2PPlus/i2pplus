    launch4jJar, launcherSupported, installerUtil)

// IzPack 4 installer builds; each produces one jar (the exe is the separate
// installerexe task), then the platform jar names as in ant
def makeIzpack4Task(String taskName, String stageTask, String jbigiTask, String outJarName, String taskDesc, Map cfg,
                    String variant, String stageDir) {
  // variant picks this build's filtered descriptor; stageTask must stage the matching
  // directory, or the descriptor names a payload the install never unpacked.
  final String descriptor = "${cfg.izWork}/${variant}/4/install.xml"
  final String prepCfg = "prepIzpackConfigs${variant.capitalize()}"
  task(taskName, type: Exec) {
    group = 'package'
    description = taskDesc
    dependsOn stageTask, jbigiTask, izpackPatches, prepCfg
    // CLI is positional: the xml file comes first, '-b' is the base path and '-k' the kind
    commandLine 'java', '-jar', cfg.compiler, descriptor,
        '-b', cfg.wsAbs, '-k', 'standard', '-o', "${cfg.dAbs}/${outJarName}"
    inputs.files(fileTree(stageDir), file(descriptor), izpackPatches)
    outputs.file("${cfg.dAbs}/${outJarName}")
    doLast {
      cfg.util.printSha(new File("${cfg.dAbs}/${outJarName}"))
    }
  }
}


    'all', "${stageRoot}/all")
makeIzpack5Task('installer5-nowindows', 'preppkg-nowindows', 'jbigi-nowindows', "i2pinstall_${fullVersion}.jar",
    'Build the no-windows installer jar with IzPack 5 (mirrors ant installer5-nowindows).', izpack5Cfg,
    'nowindows', "${stageRoot}/nowindows")
makeIzpack5Task('installer5-linux', 'preppkg-linux-only', 'jbigi-linux', "i2pinstall_${fullVersion}_linux-only.jar",

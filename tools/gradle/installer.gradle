// mac app bundle from the osx-only installer jar (ant installer2app)
task installer2app {
  group = 'package'
  description = 'Build the mac installer app bundle and dist/i2pinstall_<version>_osx.tar.bz2 (mirrors ant installer2app).'
  dependsOn 'installer-osx'
  onlyIf { new File(izpack2appPy).isFile() }
  inputs.file("${distAbs}/i2pinstall_${fullVersion}_osx-only.jar")
  outputs.file("${distAbs}/i2pinstall_${fullVersion}_osx.tar.bz2")
  doLast {
    String appDir = "${stageRoot}/osx/osx/i2p-${fullVersion}_osx-install.app"
    def pb = new ProcessBuilder(iz5python, izpack2appPy,
        "${distAbs}/i2pinstall_${fullVersion}_osx-only.jar", appDir)
    pb.inheritIO()
    if (pb.start().waitFor() != 0) {
      throw new GradleException("izpack2app.py failed")
    }
    def tb = new ProcessBuilder('tar', '-cjf', "${distAbs}/i2pinstall_${fullVersion}_osx.tar.bz2",
        '-C', new File(appDir).parentFile.absolutePath, new File(appDir).name)
    tb.inheritIO()
    if (tb.start().waitFor() != 0) {
      throw new GradleException("tar failed")
    }
    installerUtil.printSha(new File("${distAbs}/i2pinstall_${fullVersion}_osx.tar.bz2"))
  }
}

// Fetches the IzPack 5 distribution into installer/lib/izpack/5/ (ant
// download-izpack5). Skipped when izpack5.home was set on the command line,
// which mirrors ant's ensureIzpack5 leaving a preset home alone.
tasks.register('downloadIzpack5', Exec) {
  group = 'package'
  description = 'Download or update the IzPack 5 distribution (mirrors ant download-izpack5).'
  onlyIf { !iz5homePreset }
  commandLine "${workspaceRootAbs}/installer/lib/izpack/5/download-izpack5.sh"
}

// Shared IzPack 5 failure message (ant ensureIzpack5). A plain String rather
// than a closure so task closures capture it by value under the config cache.
final def izpack5Missing = "Error - IzPack 5 must be present at ${iz5home} (lib/ not found), " +
    "or set izpack5.home=/PATH/TO/IzPack to use an existing installation, " +
    "or run installer/lib/izpack/5/download-izpack5.sh to fetch it"

// Our IzPack 5 panels, compiled into the jar the compiler loads panel classes from
// (ant izpack-panel-jar). Without it the compiler only ever sees the distribution and
// installer5 fails with "Class 'net.i2p.installer.LocalizedHTMLInfoPanel' not found".
// Built under buildDir rather than in-tree at patches/java/build as ant does, so module
// builds stay out of the source tree.
task izpackPanelClasses(type: JavaCompile) {
  group = 'package'
  description = 'Compile the IzPack 5 panel patches against the IzPack distribution (mirrors ant izpack-panel-jar, compile half).'
  dependsOn downloadIzpack5
  source = fileTree(panelSrcDir) { include '**/*.java' }
  destinationDirectory = panelClassesDir
  // Resolved lazily, so the distribution may be downloaded during this same run
  classpath = files(fileTree(file("${iz5home}/lib")) { include '*.jar' })
  options.encoding = 'UTF-8'
  options.release = 8            // ant compiles these at source/target 8
  options.compilerArgs << '-Xlint:-options'
  options.compilerArgs << '-XDignore.symbol.file'
  doFirst {
    if (!new File("${iz5home}/lib").isDirectory()) {
      throw new GradleException(izpack5Missing)
    }
  }
}

task izpackPanelJar(type: Jar) {
  group = 'package'
  description = 'Build the IzPack 5 panel jar the compiler loads <panel classname=...> from (mirrors ant izpack-panel-jar).'
  dependsOn izpackPanelClasses
  archiveFileName.set('izpack-i2p.jar')
  destinationDirectory.set(file("${buildDir}/izpack-panel"))
  from panelClassesDir
  inputs.files(fileTree(panelSrcDir) { include '**/*.java' })
  outputs.file(panelJarFile)
}

// Panel tests (mirrors ant izpack-branding-check, which compiles this directory).
// Both suites are plain main() programs, matching the ant build.
final def panelTestDir = file("${workspaceRootAbs}/installer/lib/izpack/5/patches/java/test")
final def panelTestClassesDir = file("${buildDir}/izpack-panel/test-classes")

task izpackPanelTestClasses(type: JavaCompile) {
  group = 'verification'
  description = 'Compile the IzPack 5 panel tests against the distribution and our panel jar.'
  dependsOn downloadIzpack5, izpackPanelJar
  source = fileTree(panelTestDir) { include '**/*.java' }
  destinationDirectory = panelTestClassesDir
  classpath = files(fileTree(file("${iz5home}/lib")) { include '*.jar' }, izpackPanelJar)
  options.encoding = 'UTF-8'
  options.release = 8
  options.compilerArgs << '-Xlint:-options'
  doFirst {
    if (!new File("${iz5home}/lib").isDirectory()) {
      throw new GradleException(izpack5Missing)
    }
  }
}

// Guards the panel classes: the constructor signatures picocontainer needs, the
// resource rebase, and that IzPack still resolves the console and automation
// counterparts of LocalizedHTMLInfoPanel. Needs no built installer, so it can run
// before installer5.
task izpackPanelTest(type: JavaExec) {
  group = 'verification'
  description = 'Run LocalizedResourcesTest against the panel jar (needs no built installer).'
  dependsOn izpackPanelTestClasses
  mainClass = 'net.i2p.installer.LocalizedResourcesTest'
  classpath = files(panelTestClassesDir, panelJarFile,
      fileTree(file("${iz5home}/lib")) { include '*.jar' })
}

// ant izpack-branding-check: reads the langpacks and CustomLangPack out of the built
// installer, so it reports the previous build's strings unless dist/install.jar is
// current. Fails loudly rather than silently checking a jar that is not there.
task izpackBrandingCheck(type: JavaExec) {
  group = 'verification'
  description = 'Run BrandingSuppressedTest against dist/install.jar (mirrors ant izpack-branding-check).'
  dependsOn izpackPanelTestClasses
  mainClass = 'net.i2p.installer.BrandingSuppressedTest'
  classpath = files(panelTestClassesDir, fileTree(file("${iz5home}/lib")) { include '*.jar' },
      file("${distAbs}/install.jar"))
  doFirst {
    if (!new File("${distAbs}/install.jar").isFile()) {
      throw new GradleException("${distAbs}/install.jar is missing - run ./gradlew installer5 first")
    }
  }
}

// IzPack 5 variants; the distribution is downloaded on demand and the build
// fails with the ant message if that leaves no usable copy
def makeIzpack5Task(String taskName, String stageTask, String jbigiTask, String outJarName, String taskDesc, Map cfg,
                    String variant, String stageDir) {
  // variant picks this build's filtered descriptor; stageTask must stage the matching
  // directory, or the descriptor names a payload the install never unpacked.
  final String descriptor = "${cfg.izWork}/${variant}/5/install5.xml"
  final String prepCfg = "prepIzpackConfigs${variant.capitalize()}"
  task(taskName, type: Exec) {
    group = 'package'
    description = taskDesc
    dependsOn stageTask, jbigiTask, prepCfg, downloadIzpack5, izpackFlagGifs, izpackPanelJar
    // The descriptor is POSITIONAL. CliAnalyzer accepts only -b/--base, -c/--compression,
    // -h, -k/--kind, -l/--compression-level and -o/--out, so passing it as -c was read as
    // a compression format and the compiler printed its usage and exited 1. Ant does not
    // hit this because it goes through the IzPackTask wrapper, which maps attributes.
    commandLine 'java', '-cp', cfg.compilerCp, 'com.izforge.izpack.compiler.bootstrap.CompilerLauncher',
        descriptor, '-b', cfg.wsAbs, '-k', 'standard', '-o', "${cfg.dAbs}/${outJarName}"
    inputs.files(fileTree(stageDir), file(descriptor), izpackPanelJar)
    outputs.file("${cfg.dAbs}/${outJarName}")
    doFirst {
      if (!new File("${cfg.iz5home}/lib").isDirectory()) {
        throw new GradleException(izpack5Missing)
      }
      // Custom langpacks and flags load relative to the working directory, which is the
      // repo root for this task - the same place ant puts them.
      cfg.util.stageLangpacksAndFlags(cfg.wsAbs as String)
    }
    doLast {
      cfg.util.printSha(new File("${cfg.dAbs}/${outJarName}"))
    }
  }
}


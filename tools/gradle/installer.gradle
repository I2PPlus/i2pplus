// IzPack5 exe via izpack2exe.py (ant installer5exe), fixed to read dist/install.jar
task installer5exe(type: Exec) {
    group = 'package'
    description = 'Build dist/i2pinstall.exe from dist/install.jar with IzPack5 izpack2exe.py (mirrors ant installer5exe).'
    dependsOn installer5
    onlyIf { launcherSupported }
    workingDir "${iz5home}/utils/wrappers/izpack2exe"
    commandLine 'python', 'izpack2exe.py', "--file=${distAbs}/install.jar",
            '--with-7z=/usr/bin/7zr', '--no-upx', "--output=${distAbs}/i2pinstall.exe"
    outputs.file("${distAbs}/i2pinstall.exe")
    doFirst {
        if (!new File(iz5home).isDirectory()) {
            throw new GradleException("Error - IzPack 5.1.x must be installed at ${iz5home}, " +
                    "or set izpack5.home=..., or download from http://izpack.org/downloads/ and install")
        }
        new File("${iz5home}/utils/wrappers/izpack2exe/7za").setExecutable(true)
        new File("${iz5home}/utils/wrappers/izpack2exe/izpack2exe.py").setExecutable(true)
    }
    doLast {
        installerUtil.printSha(new File("${distAbs}/i2pinstall.exe"))
    }
}


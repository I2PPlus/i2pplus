// Variant-specific jbigi.jar built from the bundled natives (ant jbigi-*-only)
def makeJbigiJarTask(String taskName, String stageDir, String variant, String taskDesc, String version) {
  String stageDep = [all: 'preppkg', nowindows: 'preppkg-nowindows', linux: 'preppkg-linux-only',
           freebsd: 'preppkg-freebsd-only', osx: 'preppkg-osx-only',
           windows: 'preppkg-windows-only'][variant]
  // Ant filesets split the includes on spaces; one pattern per gradle include
  String[] includePatterns = ([all: '*.so *.dll *.jnilib', nowindows: '*.so *.jnilib',
                linux: '*linux*.so', freebsd: '*bsd*.so', osx: '*.jnilib',
                windows: '*windows*.dll'][variant] as String).split()
  def matches = fileTree('installer/lib/jbigi') { include includePatterns }.files
  if (matches.isEmpty()) {
    throw new GradleException("No jbigi natives for installer variant ${variant} (patterns ${includePatterns.join(' ')})")
  }
  task(taskName, type: Jar) {
    group = 'package'
    description = taskDesc
    dependsOn stageDep
    archiveFileName.set('jbigi.jar')
    destinationDirectory.set(file("${stageDir}/lib"))
    from('installer/lib/jbigi') {
      include includePatterns
    }
    manifest {
      attributes('Implementation-Version': version, 'Built-By': 'I2P+',
           'Build-Date': new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm:ss').format(new Date()),
           'Base-Revision': 'git', 'Workspace-Changes': '')
    }
  }
}

makeJbigiJarTask('jbigi', "${stageRoot}/all", 'all',

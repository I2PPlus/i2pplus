task izpackPatches(type: Jar) {
  group = 'package'
  description = 'Build the IzPack 4 patches jar installer/lib/izpack/patches.jar (mirrors ant izpack-patches).'
  archiveFileName.set('patches.jar')
  destinationDirectory.set(file('installer/lib/izpack'))
  from 'installer/lib/izpack/4/patches'

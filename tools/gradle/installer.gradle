// Windows-only izpack4 installer: intermediate names avoid clobbering the
// full installer's install.jar / i2pinstall.exe when both build in parallel
// (fixes ant's broken move from basedir/i2pinstall.exe)
task installerW4Jar(type: Exec) {
    group = 'package'
    description = 'Build the windows-only installer jar (mirrors ant installer-windows).'
    dependsOn 'preppkg-windows-only', 'jbigi-windows', izpackPatches, prepIzpackConfigs
    commandLine 'java', '-jar', izPack4Compiler, "${izpackWork}/4/install.xml",
            '-b', workspaceRootAbs, '-k', 'standard', '-o', "${distAbs}/install-windows.jar"
    inputs.files(fileTree(payloadSeed), file("${izpackWork}/4/install.xml"), izpackPatches)
    outputs.file("${distAbs}/install-windows.jar")
}

task installerW4Exe(type: Exec) {
    group = 'package'
    description = 'Wrap the windows-only installer jar (mirrors ant installer-windows).'
    dependsOn installerW4Jar
    onlyIf { launcherSupported }
    commandLine 'java', '-jar', launch4jJar, "${launcherWork}/i2pinstall-windows.xml"
    outputs.file("${distAbs}/i2pinstall-windows.exe")
    doFirst {
        // Generated config with absolute dist/ paths, so launch4j finds both files
        new File("${launcherWork}" as String).mkdirs()
        new File("${launcherWork}/i2pinstall-windows.xml" as String).setText(
                '<launch4jConfig>\n' +
                '  <headerType>0</headerType>\n' +
                '  <jar>' + "${distAbs}/install-windows.jar" + '</jar>\n' +
                '  <outfile>' + "${distAbs}/i2pinstall-windows.exe" + '</outfile>\n' +
                '  <errTitle>I2P+ Installer</errTitle>\n' +
                '  <chdir>.</chdir>\n' +
                '  <customProcName>false</customProcName>\n' +
                '  <icon>' + "${workspaceRootAbs}/installer/resources/platform-specific/windows/console.ico" + '</icon>\n' +
                '  <jre>\n    <minVersion>1.8</minVersion>\n  </jre>\n' +
                '</launch4jConfig>', 'UTF-8')
    }
    doLast {
        // Rename to the ant output name and drop the intermediate jar
        new File("${distAbs}/i2pinstall-windows.exe").renameTo(new File("${distAbs}/i2pinstall_${fullVersion}_windows.exe"))
        new File("${distAbs}/install-windows.jar").delete()
        installerUtil.printSha(new File("${distAbs}/i2pinstall_${fullVersion}_windows.exe"))
    }
}

task('installer-windows') {
    group = 'package'
    description = 'Build the windows-only installer exe dist/i2pinstall_<version>_windows.exe (mirrors ant installer-windows).'
    dependsOn installerW4Exe
}

// mac app bundle from the osx-only installer jar (ant installer2app)
task installer2app {
    group = 'package'
    description = 'Build the mac installer app bundle and dist/i2pinstall_<version>_osx.tar.bz2 (mirrors ant installer2app).'
    dependsOn 'installer-osx'
    onlyIf { new File(izpack2appPy).isFile() }
    inputs.file("${distAbs}/i2pinstall_${fullVersion}_osx-only.jar")
    outputs.file("${distAbs}/i2pinstall_${fullVersion}_osx.tar.bz2")
    doLast {
        String appDir = "${stageRoot}/osx/osx/i2p-${fullVersion}_osx-install.app"
        def pb = new ProcessBuilder('python', izpack2appPy,
                "${distAbs}/i2pinstall_${fullVersion}_osx-only.jar", appDir)
        pb.inheritIO()
        if (pb.start().waitFor() != 0) {
            throw new GradleException("izpack2app.py failed")
        }
        def tb = new ProcessBuilder('tar', '-cjf', "${distAbs}/i2pinstall_${fullVersion}_osx.tar.bz2",
                '-C', new File(appDir).parentFile.absolutePath, new File(appDir).name)
        tb.inheritIO()
        if (tb.start().waitFor() != 0) {
            throw new GradleException("tar failed")
        }
        installerUtil.printSha(new File("${distAbs}/i2pinstall_${fullVersion}_osx.tar.bz2"))
    }
}

// IzPack 5 variants; they need IzPack 5 at ${user.home}/IzPack and fail with
// the ant message otherwise
def makeIzpack5Task(String taskName, String stageTask, String jbigiTask, String outJarName, String taskDesc, Map cfg) {
    task(taskName, type: Exec) {
        group = 'package'
        description = taskDesc
        dependsOn stageTask, jbigiTask, prepIzpackConfigs
        commandLine 'java', '-cp', "${cfg.iz5home}/lib/*", 'com.izforge.izpack.compiler.bootstrap.CompilerLauncher',
                '-c', "${cfg.izWork}/5/install5.xml", '-b', cfg.wsAbs, '-o', "${cfg.dAbs}/${outJarName}"
        inputs.files(fileTree(cfg.seed), file("${cfg.izWork}/5/install5.xml"))
        outputs.file("${cfg.dAbs}/${outJarName}")
        doFirst {
            if (!new File(cfg.iz5home).isDirectory()) {
                throw new GradleException("Error - IzPack 5.1.x must be installed at ${cfg.iz5home}, " +
                        "or set izpack5.home=..., or download from http://izpack.org/downloads/ and install")
            }
            // Custom langpacks load relative to the working directory; place
            // them at the repo root, as ant does (distclean wipes com/)
            new File("${cfg.wsAbs}/com/izforge/izpack/bin/langpacks" as String).mkdirs()
            new File("${cfg.wsAbs}/com/izforge/izpack/bin/langpacks" as String).deleteDir()
            def src = new File("${cfg.wsAbs}/installer/lib/izpack/5/patches/resources")
            src.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                def rel = src.toPath().relativize(f.toPath()).toString()
                new File("${cfg.wsAbs}/com/izforge/izpack/bin/langpacks/${rel}").parentFile.mkdirs()
                f.copyTo(new File("${cfg.wsAbs}/com/izforge/izpack/bin/langpacks/${rel}"))
            }
        }
        doLast {
            cfg.util.printSha(new File("${cfg.dAbs}/${outJarName}"))
        }
    }
}


        new File("${launcherWork}" as String).mkdirs()
        new File("${launcherWork}/launchi2p.xml" as String).setText(launchi2pXmlText, 'UTF-8')
    }
}

task launch4jWrap(type: Exec) {
    group = 'package'
    description = 'Wrap launchi2p.jar as i2p.exe via launch4j (mirrors ant buildexe).'
    dependsOn launchi2pJar, launchi2pXml
    onlyIf { launcherSupported }
    workingDir launcherWork
    commandLine 'java', '-jar', launch4jJar, "${launcherWork}/launchi2p.xml"
}

task buildexe {
    group = 'package'
    description = 'Build the launchi2p.jar manifest and i2p.exe windows launcher via launch4j (mirrors ant buildexe).'
    dependsOn launch4jWrap
}

// Shared launch4j invocation for the installer exes (ant installerexe etc.)
def makeLaunch4jTask(String taskName, String configFile, String outExe, String taskDesc, String dep,
                     String launch4jPath, boolean supported, InstallerUtil util) {
    task(taskName, type: Exec) {
        group = 'package'
        description = taskDesc
        dependsOn dep
        onlyIf { supported }
        commandLine 'java', '-jar', launch4jPath, configFile
        outputs.file(outExe)
        doLast {
            util.printSha(new File(outExe))
        }
    }
}

makeLaunch4jTask('installerexe', "${workspaceRootAbs}/installer/i2pinstaller.xml", "${distAbs}/i2pinstall.exe",
        'Build dist/i2pinstall.exe from dist/install.jar via launch4j (mirrors ant installerexe).', 'installer',
        launch4jJar, launcherSupported, installerUtil)

// IzPack 4 installer builds; each produces one jar (the exe is the separate
// installerexe task), then the platform jar names as in ant
def makeIzpack4Task(String taskName, String stageTask, String jbigiTask, String outJarName, String taskDesc, Map cfg) {
    task(taskName, type: Exec) {
        group = 'package'
        description = taskDesc
        dependsOn stageTask, jbigiTask, izpackPatches, prepIzpackConfigs
        // CLI is positional: the xml file comes first, '-c' is compression
        commandLine 'java', '-jar', cfg.compiler, "${cfg.izWork}/4/install.xml",
                '-b', cfg.wsAbs, '-k', 'standard', '-o', "${cfg.dAbs}/${outJarName}"
        inputs.files(fileTree(cfg.seed), file("${cfg.izWork}/4/install.xml"), izpackPatches)
        outputs.file("${cfg.dAbs}/${outJarName}")
        doLast {
            cfg.util.printSha(new File("${cfg.dAbs}/${outJarName}"))
        }
    }
}


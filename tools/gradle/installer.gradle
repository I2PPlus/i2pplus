    'Build the full all-platform installer dist/install.jar (mirrors ant installer).', izpack4Cfg,
    'all', "${stageRoot}/all")
makeIzpack4Task('installer-nowindows', 'preppkg-nowindows', 'jbigi-nowindows', "i2pinstall_${fullVersion}.jar",

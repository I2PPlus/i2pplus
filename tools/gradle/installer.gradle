// Language-picker flag GIFs the IzPack distributions do not ship (ant
// izpack-flag-gifs). Both compilers hardcode
// bin/langpacks/flags/<iso3>.gif and fail when it is absent, and neither has a
// PNG or SVG path, so the flags we supply are rasterised from the console's SVG
// set. The GIFs are committed, so --ensure writes nothing and needs no
// rasteriser on a normal build; it only fires when a descriptor gains a langpack
// whose flag is missing.
// Resolved at configuration time: file(...) is a Gradle script method, and calling it
// from a closure that runs at execution time is what the configuration cache rejects.
final def flagsScript = file("${workspaceRootAbs}/installer/lib/izpack/gen-izpack-flags.sh")

task izpackFlagGifs(type: Exec) {
  group = 'package'
  description = 'Generate any missing IzPack langpack flag GIFs from the console SVG flags (mirrors ant izpack-flag-gifs).'
  commandLine flagsScript.absolutePath, '--ensure'
  inputs.files(flagsScript)
  inputs.files(file('installer/lib/izpack/4/install.xml'))
  inputs.files(file('installer/lib/izpack/5/install5.xml'))
  // The flags are shared by both IzPack versions, so this is the single directory
  // that can come out changed; it used to name the IzPack 5 tree only, which meant
  // a flag added for IzPack 4 alone did not mark this task out of date.
  outputs.dir(file('installer/lib/izpack/resources/flags'))
  onlyIf { flagsScript.canExecute() }
}


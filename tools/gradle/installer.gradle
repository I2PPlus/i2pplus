// Filtered IzPack install descriptors with the pkg-temp dir redirected to the
// gradle payload location (ant preppkg-base ends with the same substitution)
task prepIzpackConfigs(type: Copy) {
    group = 'package'
    description = 'Prepare the IzPack 4/5 install descriptors for the gradle payload dir (mirrors ant preppkg-base).'
    destinationDir = izpackWork
    from('installer/lib/izpack/4/install.xml') {
        into '4'
        filter { line -> line.replace('dir="pkg-temp"', 'dir="' + payloadSeed + '"') }
    }
    from('installer/lib/izpack/5/install5.xml') {
        into '5'
        filter { line -> line.replace('dir="pkg-temp"', 'dir="' + payloadSeed + '"') }
    }
}

// IzPack 4 patches jar, built from the bundled patch classes (ant izpack-patches)
task izpackPatches(type: Jar) {
    group = 'package'
    description = 'Build the IzPack 4 patches jar installer/lib/izpack/patches.jar (mirrors ant izpack-patches).'
    archiveFileName.set('patches.jar')
    destinationDirectory.set(file('installer/lib/izpack'))
    from 'installer/lib/izpack/4/patches'
}


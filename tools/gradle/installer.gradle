// Gradle mirrors of the IzPack installer targets in build.xml: installer,
// installer5, the per-platform installers, and their payload staging.
//
// Each platform variant stages its payload into its own directory under
// /tmp/build-i2p/pkg-installer (ant reuses the shared pkg-temp serially;
// separate dirs let the parallel Gradle graph rebuild the full installer and
// the platform installers without racing the update zip payload).
//
// Deliberate fixes vs ant, noted in the README: ant's installer-windows /
// installer5-windows / installer2app targets reference files at the repo root
// (basedir/install.jar, basedir/i2pinstall.exe) that never exist there, so the
// exe move fails in ant; the ports use dist/ paths instead.
//
// IzPack 4 (bundled) serves the installer family; IzPack 5 (external, at
// ~/IzPack) serves the installer5 family. launch4j is bundled but ships no
// macOS binaries, so exe targets only run on x86 Linux/Windows, as in ant.
//
// Configuration-cache safe: the payload is staged with real Copy tasks (the
// same lazy from {} pattern update.gradle uses), izpack/launch4j run as Exec
// tasks, and finishing touches (gunzip, CRLF, chmod, sha256) run as pure Java
// inside doLast. Project state is only read at configuration time; final
// locals are captured by value so they survive the cache replay.

// Final locals are captured by value in task closures, which keeps them
// resolvable when the configuration cache replays task execution; function
// bodies get the values they need as parameters instead
final def workspaceRootAbs = rootDir.absolutePath
final def stageRoot = file("${System.getProperty('java.io.tmpdir')}/build-i2p/pkg-installer")
final def izpackWork = file("${buildDir}/izpack")
final def launcherWork = file("${buildDir}/launch4j")
final def izPack4Compiler = "${workspaceRootAbs}/installer/lib/izpack/4/standalone-compiler.jar"
final def izPackPatchesJar = "${workspaceRootAbs}/installer/lib/izpack/patches.jar"
final def launch4jJar = "${workspaceRootAbs}/installer/lib/launch4j/launch4j.jar"
final def payloadSeed = "${pkgTempDir}"
final def distAbs = file('dist').absolutePath
final def fullVersion = "${ext.fullVersion}"
final def iz5home = System.getProperty('user.home') + '/IzPack'
final def izpack2appPy = "${iz5home}/utils/wrappers/izpack2app/izpack2app.py"

// One shared instance; task closures capture it by value under the config cache
final def installerUtil = new InstallerUtil()

// Closures created inside the factory functions below cannot see top-level
// locals, so each factory receives the values it needs as one config map
final def stageCfg = [seed: payloadSeed, launcherWork: "${launcherWork}",
                      fullVersion: fullVersion, wsAbs: workspaceRootAbs, util: installerUtil]
final def izpack4Cfg = [seed: payloadSeed, izWork: "${izpackWork}", dAbs: "${distAbs}",
                        wsAbs: workspaceRootAbs, compiler: izPack4Compiler, util: installerUtil]
final def izpack5Cfg = [seed: payloadSeed, izWork: "${izpackWork}", dAbs: "${distAbs}",
                        wsAbs: workspaceRootAbs, iz5home: iz5home, util: installerUtil]

// ant sets noExe when launch4j has no binaries for the build host. Final
// locals so onlyIf closures capture them by value under the config cache.
final def launcherSupported = ['x86', 'i386', 'i586', 'i686', 'amd64', 'x86_64'].contains(System.getProperty('os.arch')) &&
        (System.getProperty('os.name').toLowerCase().contains('linux') ||
         System.getProperty('os.name').toLowerCase().contains('windows'))

// Helper methods live on a plain class so task closures can call them through
// an explicit receiver; bare script methods and script locals do not resolve
// inside task configuration closures (delegate-first dispatch)
class InstallerUtil {
    // ant's sha256sum helper prints "basename: hash"
    void printSha(File absFile) {
        def pb = new ProcessBuilder('sh', '-c',
                "f=\"${absFile}\"; h=\$(sha256sum \"\$f\"); echo \"\$(basename \"\$f\"): \${h%% *}\"")
        pb.inheritIO()
        pb.start().waitFor()
    }

    void gunzip(File gz, File out) {
        out.parentFile.mkdirs()
        new FileOutputStream(out).withCloseable { fos ->
            new java.util.zip.GZIPInputStream(new FileInputStream(gz)).withCloseable { gis ->
                byte[] buf = new byte[65536]
                int n
                while ((n = gis.read(buf)) > 0) {
                    fos.write(buf, 0, n)
                }
            }
        }
    }

    // Convert the windows-relevant payload files to CRLF (ant fixcrlf)
    void crlfStage(File stage) {
        def patterns = ['**/*.config', '**/*.bat', '**/*.cmd', '**/*.xml', '**/*.properties', '**/*.txt', 'scripts/*']
        new Paths().forEachFile(stage, patterns) { File f ->
            String text = f.getText('UTF-8')
            if (text.contains('\n') && !text.contains('\r\n')) {
                f.setText(text.replaceAll('\r?\n', '\r\n'), 'UTF-8')
            }
        }
    }

    // Walker helper for crlfStage: matches ant-style include patterns per directory
    private static class Paths {
        void forEachFile(File root, List<String> patterns, Closure action) {
            root.traverse(type: groovy.io.FileType.FILES) { f ->
                def rel = root.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')
                if (patterns.any { matches(it, rel) }) {
                    action(f)
                }
            }
        }

        // Ant-style matching: '**/' at the scan-root spans any directory depth,
        // '*' spans a single path segment, 'dir/' matches everything under dir
        private static boolean matches(String pattern, String rel) {
            if (pattern.endsWith('/')) {
                return rel.startsWith(pattern)
            }
            StringBuilder regex = new StringBuilder()
            int i = 0
            while (i < pattern.length()) {
                char c = pattern.charAt(i)
                if (c == '*') {
                    if (i + 1 < pattern.length() && pattern.charAt(i + 1) == '*') {
                        if (i + 2 < pattern.length() && pattern.charAt(i + 2) == '/') {
                            regex.append('(?:[^/]+/)*')
                            i += 3
                        } else {
                            regex.append('.*')
                            i += 2
                        }
                    } else {
                        regex.append('[^/]*')
                        i += 1
                    }
                } else {
                    // Escape regex metacharacters (only '.' can appear in our patterns)
                    if (c == '.') {
                        regex.append('\\.')
                    } else {
                        regex.append(c)
                    }
                    i += 1
                }
            }
            rel ==~ regex.toString()
        }
    }
}

// One staging task per variant, named after the ant preppkg targets. The
// staging runs fresh every time (never up-to-date), exactly like ant, and the
// up-to-date checks live on the izpack tasks that consume the payload.
def makeStageTask(String taskName, String stageDir, String variant, String taskDesc, Map cfg) {
    task(taskName, type: Copy) {
        group = 'package'
        description = taskDesc
        dependsOn 'prepUpdate', ':installer:jar'
        if (variant == 'all' || variant == 'windows') {
            dependsOn 'buildexe'
        }
        // Fresh staging dir each run; the seed and all extras are re-copied
        doFirst {
            new File(stageDir).deleteDir()
        }
        // Never up-to-date: staging must mirror the payload even when only
        // the repo extras changed
        outputs.upToDateWhen { false }
        outputs.dir(stageDir)
        // ant's plain <copy> overwrites the seed (e.g. certificates); match it
        duplicatesStrategy = DuplicatesStrategy.INCLUDE

        into stageDir
        // Seed with the update payload (minus files the installer drops),
        // then add the installer-only extras
        from(cfg.seed) {
            exclude '**/*.jar.pack'
            exclude '**/*.war.pack'
            exclude '**/deletelist.txt'
            exclude 'webapps/addressbook.war'
        }
        from 'apps/i2psnark/i2psnark.config'
        from 'installer/resources/blocklist/blocklist.txt'
        from 'installer/resources/blocklist/blocklist_tor.txt'
        from 'installer/resources/clients.config'
        from 'installer/resources/i2ptunnel.config'
        from 'installer/lib/wrapper/wrapper.config'
        from 'installer/lib/wrapper/wrapper.config.commented'
        from 'installer/resources/hosts.txt'
        from 'docs/INSTALL-headless.md'
        into('scripts') {
            from 'apps/proxyscript/i2pProxy.pac'
        }
        into('docs') {
            from('installer/resources/platform-specific/windows') {
                include 'startconsole.html'
                include 'start.ico'
                include 'stop.ico'
                include 'console.ico'
                include 'uninstall.ico'
            }
            from('installer/resources/console/themes') {
                exclude '**/*.*~'
            }
        }
        into('eepsite') {
            from('installer/resources/eepsite') {
                exclude '**/.placeholder'
            }
        }
        into('eepsite-jetty9.3') {
            from 'installer/resources/eepsite-jetty9.3'
        }
        into('eepsite/docroot') {
            from('installer/resources/console/themes/console/light/images/favicon.svg') {
                rename { 'favicon.svg' }
            }
        }
        into('certificates') {
            from 'installer/resources/certificates'
        }
        // Jetty runtime jars are vendored in apps/jetty/jettylib; the legacy
        // ones never enter the payload (ant copies then deletes them)
        into('lib') {
            from('apps/jetty/jettylib') {
                include 'javax.servlet.jar'
                include 'jetty*.jar'
                include 'org.mortbay.*.jar'
                include 'commons*.jar'
                include 'jasper*.jar'
                exclude 'jetty-i2p.jar'
                exclude 'commons-logging.jar'
                exclude 'jasper-compiler.jar'
                exclude 'jetty-java5-threadpool.jar'
                exclude 'jetty-sslengine.jar'
            }
            from { project(':apps:jetty').jar.archiveFile }
        }
        into('licenses') {
            from('docs/LICENSES.md') {
                rename { 'LICENSE.md' }
            }
            from('apps/jetty/apache-tomcat-9.0.107/NOTICE') {
                rename { 'NOTICE-Tomcat.txt' }
            }
        }
        into('geoip') {
            from 'installer/resources/geoip/countries.txt'
            from 'installer/resources/geoip/continents.txt'
        }
        into('eepsite/docroot/help/lib') {
            from('apps/routerconsole/resources/icons/flags_svg') {
                include 'az.svg bn.svg cn.svg cz.svg de.svg dk.svg es.svg ee.svg fi.svg fr.svg'
                include 'gr.svg hu.svg id.svg in.svg ir.svg it.svg jp.svg kr.svg no.svg nl.svg'
                include 'pl.svg pt.svg ro.svg ru.svg se.svg si.svg tr.svg us.svg lang_ar.svg'
                include 'ua.svg vn.svg xt.svg'
            }
        }

        // Unix scripts, wrapper binaries, and windows bits for this variant
        // (ant preppkg-unix plus the per-platform preppkg-* targets)
        if (variant != 'windows') {
            from 'installer/resources/platform-specific/unix/runplain.sh'
            from 'installer/resources/platform-specific/unix/eepget'
            from 'installer/resources/platform-specific/unix/eephead'
            from 'installer/resources/platform-specific/unix/i2ping'
            from 'installer/resources/platform-specific/unix/hostping'
            from 'installer/resources/platform-specific/unix/graceful_update'
            from 'installer/resources/platform-specific/unix/i2prouter'
            from 'installer/resources/platform-specific/unix/osid'
            from 'installer/resources/platform-specific/unix/postinstall.sh'
        }
        if (variant == 'all' || variant == 'nowindows' || variant == 'linux') {
            ['linux', 'linux64', 'linux-armv5', 'linux-armv7', 'linux64-armv8'].each { d ->
                into("lib/wrapper/${d}") {
                    from("installer/lib/wrapper/${d}") {
                        exclude '*.txt'
                        exclude 'README.md'
                    }
                }
            }
        }
        if (variant == 'all' || variant == 'nowindows' || variant == 'freebsd') {
            ['freebsd', 'freebsd64'].each { d ->
                into("lib/wrapper/${d}") {
                    from("installer/lib/wrapper/${d}") {
                        exclude '*.txt'
                        exclude 'README.md'
                    }
                }
            }
        }
        if (variant == 'all' || variant == 'nowindows' || variant == 'osx') {
            into('Start I2P Router.app') {
                from 'installer/resources/platform-specific/macos/Start I2P Router.app'
            }
            into('lib/wrapper/macosx') {
                from('installer/lib/wrapper/macosx') {
                    exclude '*.txt'
                    exclude 'README.md'
                }
            }
            from 'installer/resources/platform-specific/macos/net.i2p.router.plist.template'
            from 'installer/resources/platform-specific/macos/install_i2p_service_osx.command'
            from 'installer/resources/platform-specific/macos/uninstall_i2p_service_osx.command'
        }
        if (variant == 'nowindows' && new File('installer/lib/wrapper/solaris').isDirectory()) {
            into('lib/wrapper/solaris') {
                from('installer/lib/wrapper/solaris') {
                    exclude '*.txt'
                    exclude 'README.md'
                }
            }
        }
        if (variant == 'all' || variant == 'windows') {
            ['eepget.bat', 'eephead.bat', 'i2prouter.bat', 'fixperms.bat',
             'install_i2p_service_winnt.bat', 'set_config_dir_for_nt_service.bat',
             'uninstall_i2p_service_winnt.bat', 'StartI2P+Service.bat', 'StopI2P+Service.bat',
             'EnableI2P+Service.bat', 'DisableI2P+Service.bat'].each { b ->
                from "installer/resources/platform-specific/windows/${b}"
            }
            ['win32', 'win64'].each { d ->
                into("lib/wrapper/${d}") {
                    from("installer/lib/wrapper/${d}") {
                        exclude '*.txt'
                        exclude 'README.md'
                    }
                }
            }
            from { project(':installer').jar.archiveFile }
        }

        // Old windows binaries need the matching old wrapper jar (ant
        // preppkg-windows-only), and the all-platform payload keeps both
        if (variant == 'windows') {
            into('lib') {
                from('installer/lib/wrapper/win-all/wrapper.jar')
            }
        } else {
            into('lib') {
                from('installer/lib/wrapper/all/wrapper.jar')
                if (variant == 'all') {
                    from('installer/lib/wrapper/win-all/wrapper.jar') {
                        rename { 'wrapper-windows.jar' }
                    }
                }
            }
        }

        doLast {
            File stageF = new File(stageDir)
            // GeoIP databases, as the ant preppkg-base gunzip steps
            cfg.util.gunzip(new File("${cfg.wsAbs}/installer/resources/geoip/GeoLite2-Country.mmdb.gz"),
                   new File(stageF, 'geoip/GeoLite2-Country.mmdb'))
            cfg.util.gunzip(new File("${cfg.wsAbs}/installer/resources/geoip/db-ip-asn.mmdb.gz"),
                   new File(stageF, 'geoip/db-ip-asn.mmdb'))
            if (variant == 'windows') {
                cfg.util.crlfStage(stageF)
            }
            if (variant != 'windows') {
                ['eepget', 'eephead', 'i2ping', 'hostping', 'graceful_update'].each { s ->
                    new File(stageF, s).setExecutable(true)
                }
            }
            if (variant == 'all' || variant == 'nowindows' || variant == 'osx') {
                new File(stageF, 'install_i2p_service_osx.command').setExecutable(true)
                new File(stageF, 'uninstall_i2p_service_osx.command').setExecutable(true)
            }
        }
    }
}


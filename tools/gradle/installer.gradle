// Filtered IzPack install descriptors with the pkg-temp dir redirected to the
// gradle payload location (ant preppkg-base ends with the same substitution)
// Filtered IzPack install descriptors, one pair per variant (ant preppkg-base ends
// with the same substitution, but ant has a single shared pkg-temp so one copy suffices;
// gradle stages each variant separately, so the descriptor has to name that variant's
// directory).
//
// This was pointed at ${pkgTempDir}, the update payload, while the installer-only files
// - postinstall.sh, osid, runplain.sh, i2prouter, the lib/wrapper tree, jbigi - are
// staged by preppkg into pkg-installer/<variant>. Every gradle-built IzPack installer
// therefore shipped without them and died during unpacking at "file execution error
// executing: /bin/chmod a+x <path>/postinstall.sh", which is that file simply not having
// been unpacked. ant reuses one pkg-temp for all variants; gradle cannot, which is why
// this is per variant.
def makePrepIzpackConfigs(String taskName, String variantKey, String stageDir, String workDir, String taskDesc) {
  task(taskName, type: Copy) {
    group = 'package'
    description = taskDesc
    // One directory per variant: the installer tasks build in parallel and would
    // otherwise overwrite each other's filtered descriptor between runs.
    into new File(workDir, variantKey)
    from('installer/lib/izpack/4/install.xml') {
      into '4'
      filter { line -> line.replace('dir="pkg-temp"', 'dir="' + stageDir + '"') }
    }
    from('installer/lib/izpack/5/install5.xml') {
      into '5'
      filter { line -> line.replace('dir="pkg-temp"', 'dir="' + stageDir + '"') }
    }
  }
}

makePrepIzpackConfigs('prepIzpackConfigsAll', 'all', "${stageRoot}/all", "${izpackWork}",
    'Prepare the IzPack 4/5 install descriptors for the all-platform payload dir (mirrors ant preppkg-base).')
makePrepIzpackConfigs('prepIzpackConfigsNowindows', 'nowindows', "${stageRoot}/nowindows", "${izpackWork}",
    'Prepare the IzPack 4/5 install descriptors for the no-windows payload dir (mirrors ant preppkg-base).')
makePrepIzpackConfigs('prepIzpackConfigsLinux', 'linux', "${stageRoot}/linux", "${izpackWork}",
    'Prepare the IzPack 4/5 install descriptors for the linux-only payload dir (mirrors ant preppkg-base).')
makePrepIzpackConfigs('prepIzpackConfigsFreebsd', 'freebsd', "${stageRoot}/freebsd", "${izpackWork}",

// ---------------------------------------------------------------------------
// Self-test: verify the documented task inventory, then run the safe subset
// ---------------------------------------------------------------------------

// Public tasks documented in tools/gradle/README.md (plus kebab aliases).
// The name check catches inventory drift before any compile or test work.
// SonarQube report targets (sonarqube-report, -full, -zip) are omitted for
// now: they download a server on first run, so they are exercised manually.
def documentedTasks = [
    'updater', 'updaterSmall', 'updaterRouter', 'updaterCompact',
    'prepUpdate', 'prepUpdateSmall', 'prepUpdateRouter',
    'installer', 'installerexe', 'installer-nowindows', 'installer-linux',
    'installer-freebsd', 'installer-osx', 'installer-windows', 'installer2app',
    'installer-all',
    'installer5', 'installer5exe', 'installer5-freebsd', 'installer5-linux',
    'installer5-nowindows', 'installer5-osx', 'installer5-windows',
    'installer5WExe', 'installer5WJar', 'installerW4Exe', 'installerW4Jar',
    'pkg', 'tarball', 'distclean',
    'i2psnark', 'i2psnark7zip', 'i2psnark_nozip',
    'jbigi', 'jbigi-linux', 'jbigi-osx', 'jbigi-windows', 'jbigi-freebsd',
    'jbigi-nowindows',
    'buildexe', 'buildDeb', 'poStatus',
    'testCore', 'testRouter', 'testApps',
    'preppkg', 'preppkg-nowindows', 'preppkg-linux-only',
    'preppkg-freebsd-only', 'preppkg-osx-only', 'preppkg-windows-only',
    'izpackPanelJar', 'izpackPanelTest', 'izpackBrandingCheck',
]

// Tasks actually executed here: updaterCompact compiles and packages every
// module (it taxes all sub-components), so the per-module test suites are
// not run here; report tasks (poStatus, SonarQube), the heavy packagers
// (updater*, installer*, pkg) and the tool/network-dependent targets
// (buildDeb, jbigi) are checked by name only.
def selftestReal = ['updaterCompact']

// Every task name across every project. Collected from a projectsEvaluated listener
// because this script is applied during root-project evaluation, so at that point the
// subprojects have not been evaluated and their task containers are still empty - the
// i2psnark standalone family is declared in apps/i2psnark/build.gradle and was reported
// missing for exactly that reason. A root-only lookup misses it even later.
//
// A plain Set of Strings, so selftestNames reads only captured values and stays
// configuration-cache safe.
def allTaskNames = new TreeSet<String>()
def projectCount = 0
gradle.projectsEvaluated {
    rootProject.allprojects.each { p ->
        allTaskNames.addAll(p.tasks.names)
        projectCount++
    }
}

task selftestNames {
    group = 'verification'
    description = 'Verify every documented task name still resolves.'
    doLast {
        def missing = documentedTasks.findAll { !allTaskNames.contains(it) }
        if (missing) {
            throw new GradleException("selftest: documented tasks no longer resolve: ${missing.join(', ')}")
        }
        println "selftest: all ${documentedTasks.size()} documented tasks resolve " +
                "across ${allTaskNames.size()} tasks in ${projectCount} projects"
    }
}

// Run the inventory check before any real task; its failure aborts the build
selftestReal.each { taskName ->
    tasks.named(taskName).get().mustRunAfter(selftestNames)
}

task selftest {
    group = 'verification'
    description = "Run the documented-task inventory check, then ${selftestReal.join(', ')}."
    dependsOn selftestNames
    dependsOn selftestReal
}
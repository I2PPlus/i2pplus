name: Java CI

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: PackageInstall
        run: sudo apt install -y gettext ant-contrib parallel uglifyjs

      - uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Create tmpfs for build output
        run: |
          sudo mkdir -p /tmp/build-i2p
          sudo mount -t tmpfs -o size=2G tmpfs /tmp/build-i2p

      - name: Install quiet logger (buildtools + jar to ~/.ant/lib)
        run: ant install-buildtools

      - name: Enable quiet logger for subsequent builds
        run: cp tools/ant/.antrc ~/.antrc

      - name: Build all artifacts
        run: ant updaterWithGeoIP installer i2psnark buildDeb

      - name: Create source archive
        run: |
          SHA="${{ github.sha }}"
          if [ ! -d .git ]; then
            echo "error: .git missing; cannot create source archive" >&2
            exit 1
          fi
          git archive --format=zip -o "dist/i2p-src-${SHA:0:8}.zip" "$SHA"

      - name: Build jsdoc
        continue-on-error: true
        run: ant jsdoc-zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: i2p-build-artifacts
          path: |
            dist/i2pupdate.zip
            dist/install.jar
            dist/i2pinstall.exe
            dist/i2psnark-standalone.zip
            dist/javadoc.zip
            dist/jsdoc.zip
            dist/i2p-src-*.zip
            dist/*.deb
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/i2pupdate.zip
            dist/install.jar
            dist/i2pinstall.exe
            dist/i2psnark-standalone.zip
            dist/javadoc.zip
            dist/jsdoc.zip
            dist/i2p-src-*.zip
            dist/*.deb
          generate_release_notes: true

  continuous:
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: i2p-build-artifacts
          path: artifacts/

      - name: Flatten downloaded artifacts
        run: |
          if [ -d artifacts/dist ]; then
            mv artifacts/dist/* artifacts/
            rm -rf artifacts/dist
          fi

      - name: Recreate continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=continuous
          REPO="$GITHUB_REPOSITORY"
          NAME="${GITHUB_SHA:0:8}"

          # Recreate on every run: a PATCH keeps the original published_at, so
          # the sidebar date would stay at the first build. Deleting the release
          # and tag also lets --target move the tag to the current commit.
          # --repo avoids needing a git checkout; gh can't resolve owner/repo
          # without one.
          # Capture the previous build's SHA from the old release body before
          # deleting it, so the compare API can list what changed since then.
          PREV_SHA=""
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            PREV_SHA="$(gh release view "$TAG" --repo "$REPO" --json body \
              --jq '.body | capture("^Automated build from (?<sha>[0-9a-f]{40})").sha // empty')"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
          fi

          BODY="Automated build from $GITHUB_SHA"
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$GITHUB_SHA" ]; then
            CHANGES="$(gh api "repos/$REPO/compare/$PREV_SHA...$GITHUB_SHA" \
              --jq '[.commits[].commit.message | split("\n")[0] | select(length > 0) | "- " + .] | join("\n")' \
              2>/dev/null || true)"
            if [ -n "$CHANGES" ]; then
              BODY="$BODY

          ## Changes since last build
          $CHANGES"
            fi
          fi

          CREATE=(gh release create "$TAG" --title "$NAME" --repo "$REPO")
          CREATE+=(--target "$GITHUB_SHA")
          CREATE+=(--notes "$BODY")
          CREATE+=(--latest)
          "${CREATE[@]}"

          gh release upload "$TAG" --repo "$REPO" artifacts/* --clobber

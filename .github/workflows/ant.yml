name: Java CI

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: PackageInstall
        run: |
          # libfuse2: FUSE 2. The packer needs no FUSE to build - the release
          # asset is a static binary that writes the squashfs without mounting
          # anything - but the image it produces mounts through libfuse2 when it
          # is run, and ubuntu-latest (24.04) ships fuse3 only (apt resolves
          # libfuse2 to libfuse2t64 there). Installed so the artifact this job
          # uploads can be started on the runner.
          # squashfs-tools: mksquashfs and unsquashfs, for inspecting the packed
          # image by hand. The packer does not use them: appimagetool bundles its
          # own mksquashfs and runs that, not the one on PATH. Verified with a
          # stub mksquashfs first on PATH, which is never called, and a pack that
          # succeeds on a host with no squashfs-tools installed at all - including
          # the -b 1M and -Xcompression-level 19 options build-appimage.sh passes.
          # appstream: appstreamcli, which appimagetool runs as
          # "appstreamcli validate-tree <AppDir>" before it packs. Without the
          # tool the packer only warns that it cannot check the metadata, so a
          # broken AppStream file ships instead of failing the build.
          # openjdk-17: the runtime the AppImage ships. Everything else here
          # builds on the Temurin JDK 8 set up below; buildAppImage copies this
          # Debian-path JVM into the AppDir (ant appimage.jdk).
          # ca-certificates-java: the trust store the Debian JDK points at
          # (/etc/ssl/certs/java/cacerts). It is a dependency of the JRE, so apt
          # pulls it in anyway, but build-appimage.sh reads that path directly to
          # put a real cacerts file in the image - the JDK's own link into /etc
          # does not survive the move into an AppImage.
          sudo apt install -y gettext ant ant-optional junit4 ant-contrib parallel uglifyjs python3 libfuse2 squashfs-tools appstream openjdk-17-jdk-headless ca-certificates-java
          sudo npm install -g minify

      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Create tmpfs for build output
        run: |
          # 2.5G: the build root holds the compiled classes (~170MB measured) and
          # the package payload, and buildAppImage stages the AppDir beside them -
          # the bundled JDK 17 (~260MB) plus a second copy of the payload. The cap
          # is lazy, so the extra half gig costs nothing until it is used.
          sudo mkdir -p /tmp/build-i2p
          sudo mount -t tmpfs -o size=2560M tmpfs /tmp/build-i2p

      - name: Install quiet logger (buildtools + jar to ~/.ant/lib)
        run: ant install-buildtools

      - name: Enable quiet logger for subsequent builds
        run: cp tools/ant/.antrc ~/.antrc

      # Static check of the JSPs for what JspC does not see: bean properties are
      # accessed reflectively, so a removed getter compiles clean and 500s at runtime.
      - name: Check the JSPs
        run: ant checkjsps

      - name: Install python deps for test reporting
        run: pip install --quiet --break-system-packages markdown-it-py

      - name: Build all artifacts
        run: ant updaterWithGeoIP installer i2psnark buildDeb

      # The AppImage is the one target that needs a JVM other than the one the
      # build runs on: the jars are Java 8 bytecode compiled on Temurin 8, and
      # buildAppImage copies the openjdk-17 installed above into the AppDir as
      # the shipped runtime (ant appimage.jdk).
      # appimage-setup asks api.github.com which appimagetool release is newest.
      # ant passes this job's GITHUB_TOKEN through the environment, so that query
      # is authenticated rather than one of the 60 anonymous requests an hour the
      # runner's shared egress IP is allowed.
      - name: Build AppImage
        run: ant buildAppImage

      # Documentation is a bonus artifact, not a gate. javadoc-java8 post-processes
      # the javadoc for the JDK this job runs on, so it precedes javadoc-zip, and
      # ant runs the javadoc they both depend on once.
      - name: Build javadoc
        continue-on-error: true
        run: ant javadoc-java8 javadoc-zip

      - name: Create source archive
        run: |
          SHA="${{ github.sha }}"
          if [ ! -d .git ]; then
            echo "error: .git missing; cannot create source archive" >&2
            exit 1
          fi
          git archive --format=zip -o "dist/i2p-src-${SHA:0:8}.zip" "$SHA"

      - name: Install jsdoc template dependencies
        run: bash tools/jsdoc/install-jsdoc-deps.sh

      - name: Build jsdoc
        continue-on-error: true
        run: ant jsdoc-zip

      - name: Build dev docs
        continue-on-error: true
        run: ant devdocs-zip

      # Tests are a report, not a gate: a failing suite must never stop the
      # artifact upload or the continuous release. continue-on-error keeps the job
      # green so every later step runs; the failure is surfaced by the summary step
      # below and by the log artifact, not by a red job.
      # Called directly rather than through `ant test` because the ant target passes
      # a fixed argument list and cannot carry the logging flags.
      - name: Run test suites
        continue-on-error: true
        run: bash tools/scripts/run-tests.sh --logs --logs-dir dist/test-logs all

      - name: Summarize test results
        if: always()
        run: |
          tally="$(grep -oE '[0-9]+ tests, [0-9]+ failed, [0-9]+ errors[^)]*' dist/test-report.html 2>/dev/null | head -1)"
          if [ -n "$tally" ]; then
            echo "Tests: $tally" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No test report generated" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Separate artifact on purpose: the continuous job downloads only
      # i2p-build-artifacts, so per-module ant logs never end up in a release.
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i2p-test-logs
          path: dist/test-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: i2p-build-artifacts
          path: |
            dist/i2pupdate.zip
            dist/install.jar
            dist/i2pinstall.exe
            dist/i2psnark-standalone.zip
            dist/javadoc.zip
            dist/jsdoc.zip
            dist/devdocs.zip
            dist/i2p-src-*.zip
            dist/test-report.html
            dist/*.deb
            dist/*.appimage
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/i2pupdate.zip
            dist/install.jar
            dist/i2pinstall.exe
            dist/i2psnark-standalone.zip
            dist/javadoc.zip
            dist/jsdoc.zip
            dist/devdocs.zip
            dist/i2p-src-*.zip
            dist/test-report.html
            dist/*.deb
            dist/*.appimage
          generate_release_notes: true

  continuous:
    # always(): a failed build job must not strand this job without a chance to
    # run. The step below re-checks that the run actually produced artifacts
    # before touching the release, so a build with nothing to publish leaves the
    # existing continuous release exactly as it was.
    if: always() && (github.ref_name == 'master' || github.ref_name == 'dev')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: i2p-build-artifacts
          path: artifacts/

      - name: Flatten downloaded artifacts
        run: |
          if [ -d artifacts/dist ]; then
            mv artifacts/dist/* artifacts/
            rm -rf artifacts/dist
          fi

      - name: Recreate continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=continuous
          REPO="$GITHUB_REPOSITORY"
          NAME="${GITHUB_SHA:0:8}"

          # Nothing to publish: keep the previous continuous release rather than
          # delete it. Reached when the build job failed before it wrote dist/.
          if ! compgen -G "artifacts/*" > /dev/null; then
            echo "No artifacts from the build job; leaving the existing release untouched."
            exit 0
          fi

          # Recreate on every run: a PATCH keeps the original published_at, so
          # the sidebar date would stay at the first build. Deleting the release
          # and tag also lets --target move the tag to the current commit.
          # --repo avoids needing a git checkout; gh can't resolve owner/repo
          # without one.
          # Capture the previous build's SHA from the old release body before
          # deleting it, so the compare API can list what changed since then.
          # Tolerate the release being absent (first run) or already deleted by
          # a concurrent run (gh resolves tag -> release id, and a stale id
          # 404s under the delete).
          PREV_SHA=""
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            PREV_SHA="$(gh release view "$TAG" --repo "$REPO" --json body \
              --jq '.body | capture("^Automated build from (?<sha>[0-9a-f]{40})").sha // empty' 2>/dev/null || true)"
            gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
          fi

          BODY="Automated build from $GITHUB_SHA"
          if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$GITHUB_SHA" ]; then
            CHANGES="$(gh api "repos/$REPO/compare/$PREV_SHA...$GITHUB_SHA" \
              --jq '[.commits[].commit.message | split("\n")[0] | select(length > 0) | "- " + .] | join("\n")' \
              2>/dev/null || true)"
            if [ -n "$CHANGES" ]; then
              BODY="$BODY

          ## Changes since last build
          $CHANGES"
            fi
          fi

          # Create the release. If a concurrent run already recreated the tag,
          # create fails with "already exists"; update that release in place
          # instead of retrying a doomed create.
          # Never --latest: GitHub answers 422 with "Latest release cannot be
          # draft or prerelease" when the release it is updating was left a
          # draft or a prerelease by an interrupted run, and a rolling build
          # is not the release a reader should see as latest anyway.
          if ! gh release create "$TAG" --title "$NAME" --repo "$REPO" \
              --target "$GITHUB_SHA" --notes "$BODY"; then
            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "Release $TAG already exists; updating it in place."
              # Clear a stale draft/prerelease state first, so the edit below
              # is not rejected for a state this run did not choose.
              gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease=false || true
              gh release edit "$TAG" --repo "$REPO" --title "$NAME" \
                --target "$GITHUB_SHA" --notes "$BODY" --draft=false --prerelease=false
            else
              echo "gh release create failed and no existing release found" >&2
              exit 1
            fi
          fi

          # Upload with retries for transient API failures (rate limits etc.).
          retries=0
          until gh release upload "$TAG" --repo "$REPO" artifacts/* --clobber; do
            retries=$((retries + 1))
            if [ "$retries" -ge 5 ]; then
              echo "gh release upload failed after $retries attempts" >&2
              ls -la artifacts || true
              exit 1
            fi
            echo "gh release upload failed, retrying in $((retries * 3))s..."
            sleep $((retries * 3))
          done

          echo "Release ${TAG} recreated and artifacts uploaded."

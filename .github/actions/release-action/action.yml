name: 'Continuous Release'
description: 'Recreates a release from build artifacts on every run so the release date and tag track the latest build'
author: 'I2P+'
inputs:
  tag:
    description: 'Release tag to create or update'
    required: false
    default: 'continuous'
  name:
    description: 'Release name; defaults to the 8-char commit hash'
    required: false
  body:
    description: 'Release body'
    required: false
  commit:
    description: 'Commit the tag should point at'
    required: false
  artifacts:
    description: 'Paths or glob patterns of artifacts to upload'
    required: true
  makeLatest:
    description: 'Mark the release as the latest release'
    required: false
    default: 'true'
  token:
    description: 'GitHub token'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Recreate release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        TAG="${{ inputs.tag }}"
        NAME="${{ inputs.name }}"
        if [ -z "$NAME" ]; then
            NAME="${GITHUB_SHA:0:8}"
        fi

        # Recreate on every run: a PATCH keeps the original published_at, so
        # the sidebar date would stay at the first build. Deleting the release
        # and tag also lets --target move the tag to the current commit.
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release delete "$TAG" --yes --cleanup-tag
        fi

        CREATE=(gh release create "$TAG" --title "$NAME")
        if [ -n "${{ inputs.commit }}" ]; then
          CREATE+=(--target "${{ inputs.commit }}")
        fi
        if [ -n "${{ inputs.body }}" ]; then
          CREATE+=(--notes "${{ inputs.body }}")
        fi
        if [ "${{ inputs.makeLatest }}" = "true" ]; then
          CREATE+=(--latest)
        fi
        "${CREATE[@]}"

        gh release upload "$TAG" "${{ inputs.artifacts }}" --clobber

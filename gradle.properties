# Override these in ~/.gradle/gradle.properties if necessary
java7BootClasspath=
# Must match <property name="tomcat.ver" value="..."/> in build.xml and the
# checked-in apps/jetty/apache-tomcat-<version> directory; the app build.gradle
# files resolve their fileTree through this value. tools/scripts/update-tomcat.sh
# rewrites all three together and reports any place that still names the old one.
tomcatVersion=9.0.123
jettyVersion = '9.3.30.v20211001'
# Generous heap for the daemon (compilations run in-process)
org.gradle.jvmargs=-Xmx16g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.parallel = true
# Configure every project, not only the ones the task graph needs. The build
# reaches across projects - api project(':core') in the app build files,
# project(':apps:jrobin').jar.archiveFile in tools/gradle/update.gradle - and
# configure-on-demand lets one project observe another's configurations while
# that project's own script is still running, so Gradle then refuses to add its
# dependencies: "Cannot mutate the dependencies of configuration
# ':apps:jrobin:api' after ... 'compileClasspath' was resolved". Parallel
# configuration is safe once every project is configured, so it stays on.
org.gradle.configureondemand = false
# Gradle writes the HTML problems report to <rootDir>/build/reports/problems whatever
# the root project's buildDir is, which puts it in the source tree. Warnings are on the
# console with --warning-mode all, so the report is redundant here. The configuration
# cache report (only written when a build fails) is hardcoded the same way; distclean
# removes it.
org.gradle.problems.report=false

# Override these in ~/.gradle/gradle.properties if necessary
java7BootClasspath=
tomcatVersion=9.0.62
jettyVersion = '9.3.30.v20211001'
# Generous heap for the daemon (compilations run in-process)
org.gradle.jvmargs=-Xmx16g -XX:MaxMetaspaceSize=2g -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
org.gradle.caching = true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configureondemand = true
org.gradle.parallel = true
